  function toonKlokkiezer(uitInstellingen){
    verlaatRonde();
    var niveau = S.klokNiveau;
    var soort = S.klokSoort;

    var html = '<section class="sectie"><h2>Wat wil je oefenen?</h2><div class="niveaus">';
    KLOKSOORTEN.forEach(function(v){
      html += '<button class="niveau soort' + (soort === v.id ? "" : " uit") + '" type="button" ' +
              'data-soort="' + v.id + '" aria-pressed="' + (soort === v.id) + '">' +
              '<b>' + v.naam + '</b><span>' + v.hint + '</span></button>';
    });
    html += '</div></section>';

    html += '<section class="sectie" style="margin-top:22px"><h2>Hoe moeilijk mag de klok?</h2><div class="niveaus">';
    [1,2,3].forEach(function(n){
      html += '<button class="niveau' + (niveau === n ? "" : " uit") + '" type="button" ' +
              'data-niveau="' + n + '" aria-pressed="' + (niveau === n) + '">' +
              '<b>' + NIVEAUS[n].naam + '</b><span>Bijvoorbeeld: ' + NIVEAUS[n].hint + '</span></button>';
    });
    html += '</div></section>';

    html += '<div class="kaart" style="margin-top:18px;display:flex;align-items:center;gap:16px">' +
            '<div class="klokhouder" style="flex:none;width:88px">' + klokSVG(7, 20, true) + '</div>' +
            '<p style="margin:0;font-weight:700;font-size:14px;color:var(--inkt-zacht)" id="klok-uitleg"></p></div>';
    html += '<div class="knoppen" style="margin-top:18px">' +
            '<button class="knop" type="button" id="start-klok">Start met 10 klokken</button>' +
            '<button class="knop stil" type="button" id="terug">' +
            (uitInstellingen ? "Klaar" : "Terug") + '</button></div>';
    scherm.innerHTML = html;

    function ververUitleg(){
      var tekst;
      if(soort === "analoog") tekst = "Je ziet steeds een klok en kiest hoe laat het is.";
      else if(soort === "digitaal") tekst = "Je ziet steeds een digitale tijd en zoekt de klok die zo staat.";
      else tekst = "Je krijgt beide soorten vragen door elkaar: een klok aflezen, en bij een digitale tijd de goede klok zoeken.";
      document.getElementById("klok-uitleg").textContent = tekst + " De tijden gaan met " +
        (niveau === 1 ? "hele en halve uren." : niveau === 2 ? "hele uren, halve uren en kwartieren." : "stappen van vijf minuten.");
    }

    function kiesUit(kiezer, actief){
      [].forEach.call(scherm.querySelectorAll(kiezer), function(k){
        var aan = k === actief;
        k.classList.toggle("uit", !aan);
        k.setAttribute("aria-pressed", aan);
      });
    }

    [].forEach.call(scherm.querySelectorAll("[data-soort]"), function(k){
      k.addEventListener("click", function(){
        soort = k.getAttribute("data-soort");
        kiesUit("[data-soort]", k);
        ververUitleg();
      });
    });
    [].forEach.call(scherm.querySelectorAll("[data-niveau]"), function(k){
      k.addEventListener("click", function(){
        niveau = parseInt(k.getAttribute("data-niveau"), 10);
        kiesUit("[data-niveau]", k);
        ververUitleg();
      });
    });

    function bewaarKlok(){
      S.klokNiveau = niveau;
      S.klokSoort = soort;
      bewaar();
    }
    document.getElementById("start-klok").addEventListener("click", function(){
      bewaarKlok();
      start("klok");
    });
    document.getElementById("terug").addEventListener("click", function(){
      if(uitInstellingen){ bewaarKlok(); toonInstellingen(); return; }
      toonHome();
    });
    ververUitleg();
  }

  function toonRapport(){
    verlaatRonde();
    var totaal = 0, goed = 0;
    GROEPEN.forEach(function(g){
      totaal += S.stats.groep[g.id].totaal;
      goed += S.stats.groep[g.id].goed;
    });

    var html = '<section class="sectie"><h2>Hoe gaat het met ' + veiligeTekst(S.naam) + '?</h2>';

    if(!totaal){
      html += '<div class="kaart" style="text-align:center">' +
              '<p style="margin:0;font-weight:700;color:var(--inkt-zacht)">' +
              'Er is nog niets geoefend. Na de eerste ronde sommen verschijnt hier het rapport.</p></div>';
      html += '<div class="knoppen" style="margin-top:18px">' +
              '<button class="knop" type="button" id="terug">Terug</button></div>';
      scherm.innerHTML = html;
      document.getElementById("terug").addEventListener("click", toonHome);
      return;
    }

    var percentage = Math.round(goed / totaal * 100);
    html += '<div class="kaart samenvatting">' +
            '<div><b>' + totaal + '</b><span>vragen gemaakt</span></div>' +
            '<div><b>' + percentage + '%</b><span>goed</span></div>' +
            '<div><b>' + S.stats.challenges.gehaald + '</b><span>challenges gehaald</span></div>' +
            '</div>';
    html += '</section>';

    /* per onderdeel */
    html += '<section class="sectie" style="margin-top:22px"><h2>Per onderdeel</h2><div class="kaart">';
    html += '<div class="staven">';
    var ongeoefend = [];
    GROEPEN.forEach(function(g){
      var hok = S.stats.groep[g.id];
      if(!hok || !hok.totaal){ ongeoefend.push(g.naam.toLowerCase()); return; }
      var o = oordeel(hok);
      var p = scoreVan(hok);
      html += '<div class="staaf">' +
                '<div class="rij"><b>' + g.naam + '</b>' +
                  '<span class="stempel ' + o.klasse + '">' + o.tekst + '</span></div>' +
                '<div class="spoor"><div class="vulling" style="width:' + (p === null ? 0 : p) +
                  '%;background:' + g.kleur + '"></div></div>' +
                '<div class="rij klein"><span>' + hok.goed + " van de " + hok.totaal + ' goed</span>' +
                  '<span>' + (p === null ? "" : p + "%") + '</span></div>';
      /* de losse onderwerpen binnen deze bak, zodat "afronden gaat slecht" zichtbaar blijft */
      var detail = [];
      onderwerpLijst().forEach(function(ow){
        if(ow.meta || ow.groep !== g.id || ow.id === g.id) return;
        var h = S.stats.onderwerp[ow.id];
        if(h && h.totaal) detail.push({naam:ow.naam, hok:h});
      });
      if(detail.length){
        html += '<div class="detail">';
        detail.forEach(function(d){
          var dp = scoreVan(d.hok);
          var doo = oordeel(d.hok);
          html += '<span class="deelstip ' + doo.klasse + '">' + d.naam + ' ' + dp + '%</span>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    if(ongeoefend.length){
      html += '<p class="legenda-uitleg">Nog niet geoefend: ' + ongeoefend.join(", ") + '.</p>';
    }
    html += '</div></section>';

    /* tafels apart, want daar zit het verschil per tafel */
    var tafelTotaal = 0;
    for(var t = 1; t <= 10; t++) tafelTotaal += S.stats.tafel[t].totaal;
    if(tafelTotaal){
      html += '<section class="sectie" style="margin-top:22px"><h2>De tafels apart</h2><div class="kaart">';
      html += '<div class="tafelrapport">';
      for(t = 1; t <= 10; t++){
        var hok = S.stats.tafel[t];
        var o = oordeel(hok);
        var p = scoreVan(hok);
        html += '<div class="tafelhok ' + o.klasse + '">' +
                  '<b>' + t + '</b><span>' + (p === null ? "—" : p + "%") + '</span>' +
                '</div>';
      }
      html += '</div>';
      html += '<p class="legenda-uitleg">Groen is sterk, oranje mag nog geoefend worden, ' +
              'grijs is nog te weinig gedaan om iets over te zeggen.</p>';
      html += '</div></section>';
    }

    /* vragen die het vaakst misgaan */
    if(S.stats.fouten.length){
      html += '<section class="sectie" style="margin-top:22px"><h2>Deze vragen de meeste aandacht</h2><div class="kaart">';
      html += '<ul class="aandachtlijst">';
      S.stats.fouten.slice().sort(function(a, b){ return b.aantal - a.aantal; }).slice(0, 8).forEach(function(f){
        html += '<li><span>' + f.sleutel + '</span><span class="keer">' + f.aantal +
                (f.aantal === 1 ? ' keer fout' : ' keer fout') + '</span></li>';
      });
      html += '</ul></div></section>';
    }

    /* advies */
    var zwak = zwaksteGroep();
    var advies;
    if(!zwak) advies = "Oefen nog wat vaker, dan kan ik beter zien waar " + S.naam + " hulp bij kan gebruiken.";
    else {
      var naam = "";
      GROEPEN.forEach(function(g){ if(g.id === zwak.id) naam = g.naam.toLowerCase(); });
      advies = zwak.p >= 85
        ? "Alles gaat goed! Het laagste is " + naam + " met " + zwak.p + "% — dat is nog steeds sterk. Tijd voor een pittigere challenge."
        : "Het meeste rendement zit nu bij " + naam + " (" + zwak.p + "% goed). De aanbevolen challenge oefent precies dat.";
    }
    html += '<div class="kaart advies" style="margin-top:22px"><span class="lamp">💡</span>' +
            '<p>' + advies + '</p></div>';

    html += '<div class="knoppen" style="margin-top:18px">' +
            '<button class="knop" type="button" id="naar-challenge">Naar de challenges</button>' +
            '<button class="knop stil" type="button" id="terug">Terug</button></div>';

    scherm.innerHTML = html;
    document.getElementById("naar-challenge").addEventListener("click", toonChallenges);
    document.getElementById("terug").addEventListener("click", toonHome);
  }

  /* ----- challenges ----- */
  /* hoeveel er goed moeten zijn: vier op de vijf, altijd minstens één fout toegestaan */
  function challengeNodig(lengte){
    return Math.max(1, Math.min(lengte - 1, Math.ceil(lengte * 0.8)));
  }

  /* een pittiger bereik dan de instelling: bovengrens anderhalf keer zo hoog */
  function pittigBereik(){
    var zwaarder = {};
    BEREIKEN.forEach(function(r){
      var b = S.bereik[r.id];
      var tot = Math.min(r.grens, Math.max(b.tot + 2, Math.round(b.tot * 1.5)));
      zwaarder[r.id] = schoonBereik(r.id, b.van, tot);
    });
    return zwaarder;
  }

  function challengeLijst(){
    var lengte = S.challengeLengte;
    var zwak = zwaksteGroep();
    var tafels = zwaksteTafels(3);
    var zwaarder = pittigBereik();
    var klokNiveau = Math.min(3, S.klokNiveau + 1);

    var lijst = [
      {
        id:"tafelbaas", teken:"🎯", naam:"Tafelbaas",
        uitleg:lengte + " tafelsommen uit de tafels van " + tafels.join(", ") + " — juist die vraagt je nu het meest.",
        kleur:"var(--zon)", inkt:"#3A2600"
      },
      {
        id:"klokmeester", teken:"🕐", naam:"Klokmeester",
        uitleg:lengte + " klokvragen, analoog en digitaal door elkaar, op " +
               NIVEAUS[klokNiveau].naam.toLowerCase() + ".",
        kleur:"var(--klok)", inkt:"#fff"
      },
      {
        id:"rekenracer", teken:"⚡", naam:"Rekenracer",
        uitleg:lengte + " sommen door elkaar, met grotere getallen dan je gewend bent " +
               "(tot " + zwaarder.plus.tot + " bij plus en min).",
        kleur:"var(--druif)", inkt:"#fff"
      }
    ];

    var slim = ["geld","meten","duur","verhaal","kalender"].filter(function(s){ return zichtbaar(s); });
    if(slim.length >= 2){
      lijst.push({
        id:"slimrekenen", teken:"🛒", naam:"Slim rekenen",
        uitleg:lengte + " vragen over geld, meten, tijd en verhaaltjes — rekenen zoals in het echt.",
        kleur:"var(--zee)", inkt:"#fff"
      });
    }

    if(S.stats.fouten.length >= 8){
      lijst.push({
        id:"herkansing", teken:"🔁", naam:"Herkansing",
        uitleg:lengte + " vragen die eerder misgingen. Laat zien dat je ze nu wél kent!",
        kleur:"var(--gras)", inkt:"#fff"
      });
    }

    var aanbevolen = "rekenracer";
    if(zwak){
      if(zwak.id === "tafels") aanbevolen = "tafelbaas";
      else if(zwak.id === "klok") aanbevolen = "klokmeester";
      else if((zwak.id === "geld" || zwak.id === "meten" || zwak.id === "verhaal") && slim.length >= 2){
        aanbevolen = "slimrekenen";
      }
    }
    if(S.stats.fouten.length >= 15) aanbevolen = "herkansing";

    lijst.forEach(function(c){ c.aanbevolen = (c.id === aanbevolen); });
    return lijst;
  }

  function maakChallenge(id){
    var lengte = S.challengeLengte;
    var vragen = [], gezien = {}, pogingen = 0;
    var tafels = zwaksteTafels(3);
    var klokNiveau = Math.min(3, S.klokNiveau + 1);
    /* een challenge is overal één leerjaar pittiger, en bij de vier basisbewerkingen
       ook nog een ruimer getalbereik */
    var zwaar = {leerjaar: pittigLeerjaar(), bereik: pittigBereik(), tafels: tafels,
                 niveau: klokNiveau, soort: "mix"};

    function voegToe(vraag){
      var sl = dedupeSleutel(vraag);
      if(gezien[sl]) return false;
      gezien[sl] = true;
      vragen.push(vraag);
      return true;
    }

    if(id === "herkansing"){
      /* eerst de echte missers, oplopend van vaakst fout naar minst */
      var bewaard = S.stats.fouten.slice().sort(function(a, b){ return b.aantal - a.aantal; });
      bewaard.forEach(function(f){
        if(vragen.length >= lengte) return;
        var h = herbouwVraag(f.vraag);
        if(h) voegToe(h);
      });
      /* aanvullen met verse vragen uit dezelfde onderwerpen */
      var soorten = {};
      S.stats.fouten.forEach(function(f){
        var s = f.vraag.onderwerp || f.vraag.groep;
        if(ONDERWERPEN[s]) soorten[s] = true;
      });
      var keuzes = Object.keys(soorten);
      if(!keuzes.length) keuzes = ["alles"];
      while(vragen.length < lengte && pogingen < lengte * 30){
        pogingen++;
        voegToe(maakVraag(keuzes[rnd(0, keuzes.length - 1)], zwaar));
      }
    } else if(id === "tafelbaas"){
      while(vragen.length < lengte && pogingen < lengte * 30){
        pogingen++;
        voegToe(maakVraag("tafels", {tafels:tafels}));
      }
    } else if(id === "klokmeester"){
      while(vragen.length < lengte && pogingen < lengte * 30){
        pogingen++;
        voegToe(maakVraag("klok", {niveau:klokNiveau, soort:"mix"}));
      }
    } else if(id === "slimrekenen"){
      var slim = ["geld","meten","duur","verhaal","kalender"].filter(function(s){
        return ONDERWERPEN[s] && zichtbaar(s);
      });
      if(!slim.length) slim = ["plus","min"];
      while(vragen.length < lengte && pogingen < lengte * 40){
        pogingen++;
        voegToe(maakVraag(slim[rnd(0, slim.length - 1)], zwaar));
      }
    } else if(id === "rekenracer"){
      var mix = actieveOnderwerpen();
      while(vragen.length < lengte && pogingen < lengte * 40){
        pogingen++;
        voegToe(maakVraag(mix[rnd(0, mix.length - 1)], zwaar));
      }
    } else {
      return null;
    }

    /* bij een heel klein bereik kunnen er te weinig unieke vragen zijn */
    while(vragen.length < lengte){
      vragen.push(id === "klokmeester" ? maakVraag("klok", {niveau:klokNiveau, soort:"mix"})
                : id === "tafelbaas"   ? maakVraag("tafels", {tafels:tafels})
                : maakVraag("alles", zwaar));
    }

    var omschrijving = null;
    challengeLijst().forEach(function(c){ if(c.id === id) omschrijving = c; });
    return {
      id: id,
      naam: omschrijving ? omschrijving.naam : "Challenge",
      teken: omschrijving ? omschrijving.teken : "🏅",
      nodig: challengeNodig(lengte),
      vragen: schud(vragen).slice(0, lengte)
    };
  }

  function toonChallenges(){
    verlaatRonde();
    var lijst = challengeLijst();
    var html = '<section class="sectie"><h2>Challenges</h2>';
    html += '<p class="uitlegregel">Een challenge is ' + S.challengeLengte + ' vragen lang en wat pittiger ' +
            'dan gewoon oefenen. Heb je er ' + challengeNodig(S.challengeLengte) + ' goed? Dan is hij gehaald' +
            (sparenAan()
               ? ' en krijg je <b>' + S.challengeStickers +
                 (S.challengeStickers === 1 ? " sticker" : " stickers") + '</b> erbij' +
                 (S.superAan ? ', en bij <b>alles goed</b> nog de supersticker.' : '.')
               : '.') + '</p>';
    html += '<div class="challenges">';
    lijst.forEach(function(c){
      html += '<button class="challenge" type="button" data-challenge="' + c.id + '" ' +
              'style="--kleur:' + c.kleur + ';--op:' + c.inkt + '">' +
              (c.aanbevolen ? '<span class="tip">Aanbevolen</span>' : '') +
              '<span class="teken">' + c.teken + '</span>' +
              '<span class="woorden"><b>' + c.naam + '</b><span>' + c.uitleg + '</span></span>' +
              '</button>';
    });
    html += '</div></section>';

    var ch = S.stats.challenges;
    html += '<div class="kaart" style="margin-top:18px;text-align:center">' +
            '<p style="margin:0;font-weight:700;font-size:14px;color:var(--inkt-zacht)">' +
            (ch.gedaan === 0
              ? "Je hebt nog geen challenge gedaan. Spannend!"
              : ch.gehaald + " van de " + ch.gedaan + " challenges gehaald" +
                (sparenAan() ? " · dat leverde " + (ch.gehaald * S.challengeStickers) + " extra stickers op" : "")) +
            '</p></div>';
    html += '<div class="knoppen" style="margin-top:18px">' +
            '<button class="knop stil" type="button" id="terug">Terug</button></div>';

    scherm.innerHTML = html;
    [].forEach.call(scherm.querySelectorAll("[data-challenge]"), function(k){
      k.addEventListener("click", function(){ startChallenge(k.getAttribute("data-challenge")); });
    });
    document.getElementById("terug").addEventListener("click", toonHome);
  }

  function start(cat){
    S.cat = cat;
    S.challenge = null;
    S.vragen = maakRonde(cat);
    beginRonde();
  }

  function startChallenge(id){
    var c = maakChallenge(id);
    if(!c) return;
    S.cat = null;
    S.challenge = c;
    S.vragen = c.vragen;
    beginRonde();
  }

  function beginRonde(){
    S.i = 0;
    S.invoer = "";
    S.invoer2 = "";
    S.veld = 0;
    S.bezig = false;
    S.fouten = [];
    S.goed = 0;
    S.uitslag = [];
    S.wachtpunten = 0;
    S.beloningenVoor = beloningen();
    tekenScore();
    tekenQuiz();
  }

  function tekenQuiz(){
    zetSchermstand("ronde");
    var v = S.vragen[S.i];
    /* een lijstvraag heeft een vakje per regel; die staan klaar voordat er getekend wordt */
    if(v && v.vorm === "lijst" && S.lijst.length !== v.antwoorden.length){
      S.lijst = v.antwoorden.map(function(){ return ""; });
      S.veld = 0;
    }
    var html = '<div style="display:flex;flex-direction:column;gap:18px">';

    var aantalVragen = S.vragen.length;
    html += '<div class="vraagvoortgang">';
    if(S.challenge){
      html += '<div class="challengebalk"><span>' + S.challenge.teken + ' ' + S.challenge.naam + '</span>' +
              '<span>' + S.goed + ' goed · ' + S.challenge.nodig + ' nodig</span></div>';
    }
    html += '<div class="stippen' + (aantalVragen > 12 ? " veel" : "") +
            '" aria-label="Vraag ' + (S.i + 1) + ' van ' + aantalVragen + '">';
    for(var n = 0; n < aantalVragen; n++){
      var kl = "stip";
      if(S.uitslag[n] === true) kl += " goed";
      else if(S.uitslag[n] === false) kl += " fout";
      else if(n === S.i) kl += " nu";
      html += '<span class="' + kl + '"></span>';
    }
    html += '</div>';
    if(aantalVragen > 12){
      html += '<div class="vraagteller">Vraag ' + (S.i + 1) + ' van ' + aantalVragen + '</div>';
    }
    html += '</div>';

    html += '<div class="somkaart" id="somkaart" style="--kleur:' + v.kleur + '">';
    if(v.lijf === "klok"){
      if(v.variant === "lezen"){
        html += '<div class="vraagje">Hoe laat is het?</div>';
        html += '<div class="klokhouder">' + klokSVG(v.u, v.m, true) + '</div>';
        html += '<div class="legenda"><span class="u"><i></i>korte wijzer = uren</span>' +
                '<span class="m"><i></i>lange wijzer = minuten</span></div>';
      } else {
        html += '<div class="vraagje">Welke klok staat zo?</div>';
        html += '<div class="digitaal">' + digitaal(v.u, v.m) + '</div>';
        html += '<div class="inwoorden">' + inWoorden(v.u, v.m) + '</div>';
      }
    } else {
      if(v.vraagje) html += '<div class="vraagje">' + v.vraagje + '</div>';
      if(v.zin) html += '<div class="zin">' + v.zin + '</div>';
      if(v.klokken){
        html += '<div class="klokrij">' + klokSVG(v.klokken[0][0], v.klokken[0][1], false) +
                '<span class="pijl">→</span>' + klokSVG(v.klokken[1][0], v.klokken[1][1], false) + '</div>';
      }
      if(v.lijf === "splits") html += splitsSchema(v);
      else if(v.lijf === "splitslijst") html += splitsLijst(v);
      else html += v.regel
        ? '<div class="som">' + v.regel.replace("{1}", vakHtml(1)).replace("{2}", vakHtml(2)) + '</div>'
        : somRegel(v);
      if(v.onder) html += '<div class="onder">' + v.onder + '</div>';
    }
    html += '<div class="reactie" id="reactie"></div>';
    html += '</div>';

    /* Het cijfertoetsenbord en de stopknop horen bij elkaar: samen vormen ze de
       balk die tijdens het rekenen onderaan vast blijft staan. */
    if(v.vorm !== "keuze") html += '<div class="rekenbalk">';

    if(v.vorm === "keuze"){
      html += '<div class="keuzes' + (v.opties.length === 3 ? " drie" : "") + '">';
      v.opties.forEach(function(o, n){
        if(v.lijf === "klok"){
          if(v.variant === "lezen"){
            html += '<button class="keuze" type="button" data-optie="' + n + '">' +
                    '<span class="tijd">' + digitaal(o.u, o.m) + '</span>' +
                    '<span class="woorden">' + inWoorden(o.u, o.m) + '</span></button>';
          } else {
            html += '<button class="keuze klokje" type="button" data-optie="' + n + '" aria-label="' +
                    digitaal(o.u, o.m) + '">' + klokSVG(o.u, o.m, false) + '</button>';
          }
        } else {
          html += '<button class="keuze" type="button" data-optie="' + n + '">' +
                  '<span class="tijd">' + (o.teken || o.label || o) + '</span>' +
                  (o.sub ? '<span class="woorden">' + o.sub + '</span>' : '') + '</button>';
        }
      });
      html += '</div>';
    } else {
      html += '<div class="pad">';
      ["1","2","3","4","5","6","7","8","9"].forEach(function(c){
        html += '<button class="toets" type="button" data-toets="' + c + '">' + c + '</button>';
      });
      html += '<button class="toets wis" type="button" data-toets="wis" aria-label="Wissen">⌫</button>';
      html += '<button class="toets" type="button" data-toets="0">0</button>';
      if(v.vorm === "komma"){
        html += '<button class="toets" type="button" data-toets=",">,</button>';
        html += '<button class="toets ok breed" type="button" data-toets="ok">OK</button>';
      } else if(v.minToets){
        html += '<button class="toets" type="button" data-toets="min" aria-label="Min">−</button>';
        html += '<button class="toets ok breed" type="button" data-toets="ok">OK</button>';
      } else {
        html += '<button class="toets ok" type="button" data-toets="ok">OK</button>';
      }
      html += '</div>';
    }

    html += '<div class="knoppen"><button class="knop stil" type="button" id="stop">Stoppen</button></div>';
    if(v.vorm !== "keuze") html += '</div>';
    html += '</div>';

    scherm.innerHTML = html;
    [].forEach.call(scherm.querySelectorAll("[data-toets]"), function(k){
      k.addEventListener("click", function(){ druk(k.getAttribute("data-toets")); });
    });
    [].forEach.call(scherm.querySelectorAll("[data-optie]"), function(k){
      k.addEventListener("click", function(){ kiesOptie(parseInt(k.getAttribute("data-optie"), 10)); });
    });
    /* een vak aantikken springt erheen; op een tablet is dat de enige manier */
    [].forEach.call(scherm.querySelectorAll("[data-veld]"), function(k){
      k.addEventListener("click", function(){
        if(S.bezig) return;
        S.veld = parseInt(k.getAttribute("data-veld"), 10);
        ververVak();
      });
    });
    document.getElementById("stop").addEventListener("click", stopRonde);
  }

  /* één antwoordvak; nr is 1 of 2 */
  function vakHtml(nr){
    var tekst = nr === 2 ? S.invoer2 : S.invoer;
    var actief = S.veld === (nr === 2 ? 1 : 0);
    return '<span class="vak' + (tekst === "" ? " leeg" : "") + (actief ? " caret" : "") +
           '" id="vak' + (nr === 2 ? "2" : "") + '" data-veld="' + (nr - 1) + '">' +
           (tekst === "" ? "?" : tekst) + '</span>';
  }

  /* Het splitsschema: het totaal bovenaan, twee delen eronder, en de pootjes
     ertussen. Het lege vakje zit in het schema zelf, niet in een los veld. */
  function splitsSchema(v){
    function hok(waarde, open){
      return open ? vakHtml(1) : '<span class="splitsvak">' + waarde + '</span>';
    }
    return '<div class="splits">' +
             '<div class="splitsrij-top">' + hok(v.heel, v.gat === "top") + '</div>' +
             '<svg class="splitsbenen" viewBox="0 0 200 44" preserveAspectRatio="none" aria-hidden="true">' +
               '<line x1="100" y1="1" x2="30" y2="43"/><line x1="100" y1="1" x2="170" y2="43"/>' +
             '</svg>' +
             '<div class="splitsdelen">' +
               hok(v.deel, v.gat === "links") + hok(v.deel2, v.gat === "rechts") +
             '</div>' +
           '</div>';
  }

  /* Alle splitsingen van één getal, elk op een eigen regel met een eigen vakje. */
  function splitsLijst(v){
    var uit = '<div class="splitsrijen">';
    v.rijen.forEach(function(deel, n){
      uit += '<div class="splitsrij">' +
               '<span class="splitsgetal">' + deel + '</span>' +
               '<span class="op">+</span>' + lijstVakHtml(n) +
               '<span class="op">=</span>' +
               '<span class="splitsgetal">' + v.heel + '</span>' +
             '</div>';
    });
    return uit + '</div>';
  }

  function lijstVakHtml(n){
    var tekst = S.lijst[n] || "";
    return '<span class="vak' + (tekst === "" ? " leeg" : "") + (S.veld === n ? " caret" : "") +
           '" id="lvak' + n + '" data-veld="' + n + '">' + (tekst === "" ? "?" : tekst) + '</span>';
  }

  /* de klassieke regel a op b = ?, met het gat op een instelbare plek */
  function somRegel(v){
    var gat = v.gat || "ant", d = [];
    function deel(naam){
      if(gat === naam) return vakHtml(1);
      var ruw = (naam === "b" && v.bHeel) ? String(v.b) : toonGetal(v, v[naam]);
      return '<span>' + ruw + '</span>';
    }
    d.push(deel("a"), '<span class="op">' + v.op + '</span>', deel("b"),
           '<span class="op">=</span>', deel("ant"));
    if(v.rest) d.push('<span class="restwoord">rest</span>', vakHtml(2));
    return '<div class="som">' + d.join("") + '</div>';
  }

  function ververVak(){
    var lv = S.vragen[S.i];
    if(lv && lv.vorm === "lijst"){
      for(var n = 0; n < S.lijst.length; n++){
        var el = document.getElementById("lvak" + n);
        if(!el) continue;
        var t = S.lijst[n];
        el.textContent = t === "" ? "?" : t;
        el.className = "vak" + (t === "" ? " leeg" : "") + (S.veld === n ? " caret" : "");
      }
      /* bij een lange lijst de regel waar je bent in beeld houden */
      var actief = document.getElementById("lvak" + S.veld);
      if(actief && actief.scrollIntoView){
        try{ actief.scrollIntoView({block:"nearest"}); }catch(e){}
      }
      return;
    }
    [[document.getElementById("vak"), S.invoer, 0],
     [document.getElementById("vak2"), S.invoer2, 1]].forEach(function(r){
      if(!r[0]) return;
      r[0].textContent = r[1] === "" ? "?" : r[1];
      r[0].className = "vak" + (r[1] === "" ? " leeg" : "") + (S.veld === r[2] ? " caret" : "");
    });
  }

  /* Bij een lijst met splitsingen is er een vakje per regel. OK springt naar de
     eerste regel die nog leeg is; pas als alles ingevuld is wordt er nagekeken. */
  function drukLijst(t){
    var h = S.lijst[S.veld] || "";
    if(t === "wis"){
      if(h === ""){
        if(S.veld > 0){ S.veld--; ververVak(); }
        return;
      }
      S.lijst[S.veld] = h.slice(0, -1);
      ververVak();
      return;
    }
    if(t === "ok"){ nakijken(); return; }
    if(t === "," || t === "min") return;
    if(h.length >= 2) return;
    S.lijst[S.veld] = (h === "0" ? "" : h) + t;
    ververVak();
  }

  function druk(t){
    if(S.bezig) return;
    var v = S.vragen[S.i], h = actieveInvoer();
    if(!v) return;
    if(v.vorm === "lijst"){ drukLijst(t); return; }

    if(t === "wis"){
      if(h === "" && S.veld === 1){ S.veld = 0; ververVak(); return; }   /* terug naar het eerste vak */
      zetInvoer(h.slice(0, -1));
      ververVak();
      return;
    }
    if(t === "ok"){ nakijken(); return; }
    if(t === ","){
      if(v.vorm !== "komma" || h.indexOf(",") !== -1) return;
      zetInvoer(h === "" || h === "−" ? h + "0," : h + ",");
      ververVak();
      return;
    }
    if(t === "min"){
      if(!v.minToets) return;
      zetInvoer(h.charAt(0) === "−" ? h.slice(1) : "−" + h);
      ververVak();
      return;
    }
    if(h.length >= 8) return;
    var k = h.indexOf(",");
    if(k !== -1 && h.length - k - 1 >= (v.decimalen || 2)) return;       /* niet meer decimalen dan nodig */
    if(h === "0") h = "";
    else if(h === "−0") h = "−";
    zetInvoer(h + t);
    ververVak();
  }

  function somTekst(v){
    if(v.oplossing) return v.oplossing;
    if(v.lijf === "klok") return digitaal(v.u, v.m) + " — " + inWoorden(v.u, v.m);
    return v.a + " " + v.op + " " + v.b + " = " + v.ant;
  }

  /* ----- uitleg bij een fout antwoord -----
     Het goede antwoord alleen leert weinig; een tussenstap wel. Die wordt hier uit
     de getallen van de vraag zelf afgeleid — dus geen veld op de vraag, geen
     wijziging in vragen.js, en niets dat de vraaggeneratie kan raken.
     Past er geen tussenstap bij, dan komt er niets: liever niets dan flauwekul. */
  function uitlegVan(v){
    if(!v || typeof v.ant !== "number") return null;
    var a = v.a, b = v.b;
    if(typeof a !== "number" || typeof b !== "number") return null;

    /* keer: reken vanaf een tafel die je wél weet. De tafel is altijd een getal
       t/m 10 — de tafel van 12 kent een kind niet — en het andere getal is het
       aantal keer dat je die tafel neemt. */
    if(v.op === "×"){
      if(a < 2 || b < 2 || a > 12 || b > 12) return null;
      var klein = Math.min(a, b), groot = Math.max(a, b);
      if(klein === 10 || groot === 10) return null;    /* tien keer iets legt zichzelf uit */
      var tafel = groot > 10 ? klein : groot;
      var keer = groot > 10 ? groot : klein;

      /* Staat de som omgekeerd, dan sluiten we af met de vraag zoals hij er stond —
         anders zie je "7 × 4" en gaat de uitleg over "4 × 7". */
      var slot = (a === keer ? ": " + v.ant + "." : ". Dus " + a + " × " + b + " = " + v.ant + ".");

      if(keer === 2) return "2 × " + tafel + " is het dubbele van " + tafel + slot;
      if(keer === 5){
        return "10 × " + tafel + " = " + (10 * tafel) + ", en 5 × " + tafel + " is de helft" + slot;
      }

      var anker = keer > 5 ? 10 : 5;
      var stappen = Math.abs(anker - keer);
      return anker + " × " + tafel + " = " + (anker * tafel) + ", en " + keer + " × " + tafel +
             " is " + (stappen === 1 ? "één keer " : stappen + " keer ") + tafel +
             (keer < anker ? " minder" : " erbij") + slot;
    }

    /* deel: de omgekeerde tafel, met of zonder rest */
    if(v.op === ":"){
      if(b < 2 || v.ant < 1) return null;
      if(v.rest && typeof v.ant2 === "number"){
        return b + " × " + v.ant + " = " + (b * v.ant) + ", en van " + a + " blijft er dan " +
               v.ant2 + " over.";
      }
      return b + " × " + v.ant + " = " + a + ", dus " + a + " : " + b + " = " + v.ant + ".";
    }

    /* plus en min: eerst naar het ronde tiental, dan de rest erbij of eraf */
    if(v.op === "+" || v.op === "−"){
      if(a < 10 || b < 2 || b > 99) return null;
      var rest = a % 10;
      if(!rest) return null;                           /* al rond: niets uit te leggen */
      var eerste = v.op === "+" ? 10 - rest : rest;
      if(eerste >= b) return null;                     /* je komt niet eens over het tiental */
      var tussen = v.op === "+" ? a + eerste : a - eerste;
      var tweede = b - eerste;
      return a + " " + v.op + " " + eerste + " = " + tussen + ", en dan nog " + tweede +
             (v.op === "+" ? " erbij" : " eraf") + ": " + v.ant + ".";
    }

    return null;
  }

  function verwerk(juist, schudKaart){
    var v = S.vragen[S.i];
    var kaart = document.getElementById("somkaart");
    var reactie = document.getElementById("reactie");
    S.uitslag[S.i] = juist;
    noteer(v, juist);

    if(juist){
      var vorigeStickers = stickers();
      S.goed++;
      /* In een challenge leveren losse antwoorden niets op: de hele beloning komt
         aan het eind, en alleen als de challenge gehaald is. Bij gewoon oefenen
         hangt het aan de instelling: nu bijschrijven, of pas als de reeks af is. */
      if(!S.challenge){
        if(S.puntenDirect) S.punten++;
        else S.wachtpunten++;
      }
      bewaar();
      kaart.classList.add("juist");
      reactie.className = "reactie juist";
      reactie.textContent = LOF[rnd(0, LOF.length - 1)] +
                            (S.challenge ? "" : " +1 punt");
      klankGoed();
      tekenScore();
      if(sparenAan() && !S.challenge && S.puntenDirect && stickers() > vorigeStickers){
        var nr = stickers();
        setTimeout(function(){
          klankSticker();
          toast("Nieuwe sticker verdiend! " + STICKERS[(nr - 1) % STICKERS.length] + "  (" + nr + " in totaal)");
        }, 350);
      }
      volgendeTimer = setTimeout(volgende, 900);
    } else {
      S.fouten.push(v);
      bewaar();
      if(schudKaart) kaart.classList.add("mis");
      reactie.className = "reactie mis";
      reactie.textContent = TROOST[rnd(0, TROOST.length - 1)] +
                            (v.lijf === "klok" ? " Het is " : " ") + somTekst(v);
      /* en waar het kan een tussenstap, op een eigen regel zodat het niet één
         lange zin wordt */
      var stap = uitlegVan(v);
      if(stap){
        var uitleg = document.createElement("span");
        uitleg.className = "hoe";
        uitleg.textContent = stap;
        reactie.appendChild(uitleg);
      }
      klankFout();
      /* Geen aftelklok: bij een fout antwoord staat het goede antwoord in beeld
         en mag je zelf bepalen wanneer je verder gaat, zodat er tijd is om het
         na te rekenen. */
      toonVolgendeKnop();
    }
  }

  function toonVolgendeKnop(){
    var rij = scherm.querySelector(".knoppen");
    if(!rij){ volgendeTimer = setTimeout(volgende, 2200); return; }   /* geen plek: dan toch vanzelf */
    if(document.getElementById("volgende")) return;
    var knop = document.createElement("button");
    knop.className = "knop";
    knop.type = "button";
    knop.id = "volgende";
    knop.textContent = (S.i + 1 >= S.vragen.length) ? "Klaar" : "Volgende";
    rij.insertBefore(knop, rij.firstChild);
    knop.addEventListener("click", function(){ volgende(); });
    /* de vaste balk is een knop hoger geworden; opnieuw uitmeten */
    if(document.body.getAttribute("data-scherm") === "ronde") meetToetsenbord();
  }

  function nakijken(){
    if(S.bezig) return;
    var v = S.vragen[S.i];
    if(!v) return;

    if(v.vorm === "lijst"){
      if((S.lijst[S.veld] || "") === "") return;
      for(var n = 0; n < S.lijst.length; n++){
        if(S.lijst[n] === ""){ S.veld = n; ververVak(); return; }   /* eerst de rest invullen */
      }
      S.bezig = true;
      var alGoed = klopt(v);
      markeerLijst(v);
      verwerk(alGoed, true);
      return;
    }

    if(S.invoer === "" || S.invoer === "−") return;
    if(v.vorm === "duo"){
      if(S.veld === 0){ S.veld = 1; ververVak(); return; }   /* eerst het tweede vak vullen */
      if(S.invoer2 === "") return;
    }
    S.bezig = true;
    verwerk(klopt(v), true);
  }

  /* Bij een lijst zie je per regel wat er goed ging; een verkeerde regel krijgt
     het juiste getal te zien, zodat er iets te leren valt. */
  function markeerLijst(v){
    v.antwoorden.forEach(function(goed, n){
      var el = document.getElementById("lvak" + n);
      if(!el) return;
      var klopteDeze = leesGetal(S.lijst[n]) === goed;
      if(!klopteDeze) el.textContent = String(goed);
      el.className = "vak " + (klopteDeze ? "goed" : "mis");
    });
  }

  function klopt(v){
    var doel = (typeof v.doel === "number") ? v.doel : v.ant;
    if(v.vorm === "lijst"){
      for(var n = 0; n < v.antwoorden.length; n++){
        if(leesGetal(S.lijst[n]) !== v.antwoorden[n]) return false;
      }
      return true;
    }
    if(v.vorm === "komma") return naarKlein(S.invoer, v.decimalen || 0) === doel;
    if(v.vorm === "duo") return leesGetal(S.invoer) === doel && leesGetal(S.invoer2) === v.ant2;
    return leesGetal(S.invoer) === doel;
  }

  function leesGetal(tekst){
    var min = tekst.charAt(0) === "−";
    var n = parseInt(min ? tekst.slice(1) : tekst, 10);
    if(!isFinite(n)) return NaN;
    return min ? -n : n;
  }

  function kiesOptie(n){
    if(S.bezig) return;
    var v = S.vragen[S.i];
    if(!v.opties || !v.opties[n]) return;
    S.bezig = true;
    [].forEach.call(scherm.querySelectorAll("[data-optie]"), function(k, idx){
      k.setAttribute("disabled", "disabled");
      if(idx === v.juist) k.classList.add("juist");
      else if(idx === n) k.classList.add("mis");
    });
    verwerk(n === v.juist, false);
  }

  /* ronde verlaten: een lopende vertraging mag het nieuwe scherm niet overschrijven */
  function verlaatRonde(){
    clearTimeout(volgendeTimer);
    volgendeTimer = null;
    S.vragen = [];
    S.bezig = false;
    /* Punten die op het eind van de reeks stonden te wachten, vervallen hier:
       wie halverwege weggaat, maakt de reeks niet af. */
    if(S.wachtpunten){ S.wachtpunten = 0; tekenScore(); }
    zetSchermstand("");
  }

  /* Welk scherm er in beeld is, zodat de opmaak zich kan aanpassen: tijdens het
     rekenen staat het toetsenbord vast onderaan en verdwijnt alles eromheen dat
     niet nodig is. */
  function zetSchermstand(naam){
    document.body.setAttribute("data-scherm", naam);
    var wrap = document.querySelector(".wrap");
    if(!wrap) return;
    if(naam !== "ronde"){
      document.body.classList.remove("krap");
      wrap.style.paddingBottom = "";
      return;
    }
    setTimeout(meetToetsenbord, 0);
  }

  function meetToetsenbord(){
    var wrap = document.querySelector(".wrap");
    var balk = scherm.querySelector(".rekenbalk");
    if(!wrap) return;
    document.body.classList.remove("krap");
    wrap.style.paddingBottom = "";
    if(!balk) return;

    /* Een splitsopgave met alle regels is te lang om boven het toetsenbord te
       passen. In plaats van de balk los te laten, laten we de regels zelf
       scrollen: kop, vraag en toetsenbord blijven dan staan. */
    var rijen = scherm.querySelector(".splitsrijen");
    var somkaart = scherm.querySelector(".somkaart");
    if(rijen && somkaart){
      rijen.style.maxHeight = "";
      rijen.style.overflowY = "";
      /* wat er ónder de regels nog in de kaart staat telt ook mee */
      var staart = (somkaart.offsetTop + somkaart.offsetHeight) -
                   (rijen.offsetTop + rijen.offsetHeight);
      var ruimte = window.innerHeight - rijen.offsetTop - staart - balk.offsetHeight - 16;
      if(ruimte >= 150 && rijen.scrollHeight > ruimte){
        rijen.style.maxHeight = ruimte + "px";
        rijen.style.overflowY = "auto";
      }
    }

    /* Past de som niet boven de vaste balk, bijvoorbeeld op een klein scherm of
       in liggende stand, dan is vastzetten erger dan meescrollen: dan laten we
       de balk gewoon meelopen, zodat de som bereikbaar blijft. */
    var kaart = scherm.querySelector(".somkaart");
    var onder = kaart ? kaart.offsetTop + kaart.offsetHeight : 0;
    if(onder + balk.offsetHeight + 14 > window.innerHeight){
      document.body.classList.add("krap");
      return;
    }
    /* het vaste toetsenbord bedekt de onderkant; geef de pagina die ruimte terug */
    wrap.style.paddingBottom = (balk.offsetHeight + 14) + "px";
  }

  /* de klok die na een goed antwoord vanzelf doortelt; bij stoppen zetten we hem stil */
  var volgendeTimer = null;

  function volgende(){
    volgendeTimer = null;
    if(!S.vragen.length) return;
    S.i++;
    S.invoer = "";
    S.invoer2 = "";
    S.lijst = [];
    S.veld = 0;
    S.bezig = false;
    if(S.i >= S.vragen.length) toonKlaar();
    else tekenQuiz();
  }

  /* Stoppen midden in een reeks kost iets — een challenge telt niet, en punten die
     op het eind staan te wachten vervallen. Daarom eerst even vragen. */
  function stopRonde(){
    var gedaan = S.i + (S.bezig ? 1 : 0);
    if(!gedaan){ toonHome(); return; }        /* nog niets gedaan: niets te verliezen */

    /* een goed antwoord loopt vanzelf door; dat zetten we stil zolang de vraag staat */
    var liep = volgendeTimer !== null;
    clearTimeout(volgendeTimer);
    volgendeTimer = null;

    var zover = "Je hebt er " + gedaan + " van de " + S.vragen.length + " gedaan. ";
    var staart;
    if(S.challenge){
      staart = "Een challenge telt alleen als je hem helemaal afmaakt.";
    } else if(!S.puntenDirect){
      staart = !S.wachtpunten
        ? "De punten van een reeks tellen pas als hij af is."
        : S.wachtpunten === 1
          ? "Het punt dat je nu hebt telt pas als de reeks af is — stop je nu, dan is het weg."
          : "De " + S.wachtpunten + " punten van deze reeks tellen pas als hij af is — " +
            "stop je nu, dan zijn ze weg.";
    } else {
      staart = "De punten die je al hebt, blijven gewoon staan.";
    }

    vraagZeker("Stoppen met deze reeks?", zover + staart, "Toch stoppen",
      toonHome,
      function(){ if(liep) volgende(); });
  }

  /* Een vraag met twee knoppen in dezelfde doos als de beloning. De veilige keuze

  function vraagZeker(titel, tekst, jaTekst, doeJa, doeNee){
    var ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML = '<div class="doos"><h2>' + titel + '</h2><p>' + tekst + '</p>' +
      '<div class="knoppen">' +

      '<button class="knop stil" type="button" data-zeker="ja">' + jaTekst + '</button>' +
      '</div></div>';
    document.body.appendChild(ov);

    function sluit(){
      ov.remove();
      document.removeEventListener("keydown", ontsnap, true);
    }
    function ontsnap(e){ if(e.key === "Escape"){ sluit(); if(doeNee) doeNee(); } }
    document.addEventListener("keydown", ontsnap, true);

    ov.querySelector('[data-zeker="nee"]').addEventListener("click", function(){
      sluit(); if(doeNee) doeNee();
    });
    ov.querySelector('[data-zeker="ja"]').addEventListener("click", function(){
      sluit(); doeJa();
    });
    ov.querySelector('[data-zeker="nee"]').focus();
  }

  /* ----- toetsenbord ----- */
  document.addEventListener("keydown", function(e){
    /* Staat er een venster overheen, dan hoort het toetsenbord daarbij en mag een

    if(document.querySelector(".overlay")) return;
    if(document.getElementById("code-vakjes")){
      if(e.key >= "0" && e.key <= "9"){ codeToets(e.key); e.preventDefault(); }
      else if(e.key === "Backspace"){ codeToets("wis"); e.preventDefault(); }

      return;

    if(opties.length){
      var nr = parseInt(e.key, 10);
      if(nr >= 1 && nr <= opties.length){ kiesOptie(nr - 1); e.preventDefault(); }
      return;
    }
    if(!document.getElementById("vak")) return;
    if(e.key >= "0" && e.key <= "9"){ druk(e.key); e.preventDefault(); }
    else if(e.key === "," || e.key === "."){ druk(","); e.preventDefault(); }
    else if(e.key === "-"){ druk("min"); e.preventDefault(); }
    else if(e.key === "Backspace"){ druk("wis"); e.preventDefault(); }

  });

  /* ---------- de naam van de app, en het icoon dat erbij hoort ----------
     De iconen in icons/ zijn met de hand gemaakt en zeggen "Saar". Wie de naam
     verandert, krijgt hier hetzelfde ontwerp opnieuw getekend op een canvas:
     framboosroze met ruitjes, de naam in witte letters met een schaduw, en een
     sterretje rechtsboven. */
  /* Een browser die geen canvas wil geven mag de app niet meeslepen; dan blijft
     het bestaande icoon gewoon staan. */
  function tekenIcoon(naam, maat, schaal, thema){
    try{ return tekenIcoonRuw(naam, maat, schaal, thema || icoonThema()); }
    catch(e){ return null; }
  }

  function tekenIcoonRuw(naam, maat, schaal, thema){
    var c = document.createElement("canvas");
    c.width = c.height = maat;
    var g = c.getContext("2d");
    if(!g) return null;

    g.fillStyle = thema.kleur;
    g.fillRect(0, 0, maat, maat);

    /* ruitjespapier, net als de achtergrond van de app zelf */
    g.strokeStyle = "rgba(255,255,255,.13)";
    g.lineWidth = maat / 110;
    var stap = maat / 7;
    for(var i = 1; i < 7; i++){
      var p = i * stap;
      g.beginPath(); g.moveTo(0, p); g.lineTo(maat, p); g.stroke();
      g.beginPath(); g.moveTo(p, 0); g.lineTo(p, maat); g.stroke();
    }

    /* De naam, passend geschaald en een tikje scheef als een sticker. Meten op
       de echte letterdoos, niet op de regelhoogte: anders staat korte tekst te
       klein en zakt hij uit het midden. */
    var basis = 100;
    g.font = '400 ' + basis + 'px "Lilita One", Impact, sans-serif';
    g.textAlign = "center";
    g.textBaseline = "alphabetic";
    var m = g.measureText(naam);
    var links = m.actualBoundingBoxLeft, rechts = m.actualBoundingBoxRight;
    var op = m.actualBoundingBoxAscent, neer = m.actualBoundingBoxDescent;
    var breed = (links + rechts) || m.width || 1;
    var hoog = (op + neer) || basis * 0.72;
    var factor = Math.min(maat * schaal * 0.72 / breed, maat * schaal * 0.34 / hoog);
    var xMid = -(rechts - links) / 2;      /* de letterdoos zelf midden zetten */
    var yMid = (op - neer) / 2;

    g.save();
    g.translate(maat / 2, maat / 2 + maat * 0.012);
    g.rotate(-5 * Math.PI / 180);
    g.scale(factor, factor);
    /* vullen én omlijnen, zoals de bestaande iconen: dat maakt de letters dikker */
    g.lineWidth = maat * 0.013 / factor;
    g.lineJoin = "round";
    var verzet = maat * 0.014 / factor, zak = maat * 0.024 / factor;
    g.fillStyle = g.strokeStyle = "rgba(22,36,74,.27)";
    g.fillText(naam, xMid + verzet, yMid + zak);
    g.strokeText(naam, xMid + verzet, yMid + zak);
    g.fillStyle = g.strokeStyle = "#ffffff";
    g.fillText(naam, xMid, yMid);
    g.strokeText(naam, xMid, yMid);
    g.restore();

    /* sterretje rechtsboven */
    var sr = maat * schaal * 0.115;
    var sx = maat / 2 + maat * schaal * 0.335;
    var sy = maat / 2 - maat * schaal * 0.255;
    g.beginPath();
    for(var n = 0; n < 10; n++){
      var r = (n % 2 === 0) ? sr : sr * 0.46;
      var hoek = (n * 36 - 90 + 12) * Math.PI / 180;
      var x = sx + r * Math.cos(hoek), y = sy + r * Math.sin(hoek);
      if(n === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.closePath();
    g.lineWidth = maat * 0.022;
    g.lineJoin = "round";
    g.strokeStyle = "#ffffff";
    g.stroke();
    g.fillStyle = thema.ster;
    g.fill();

    try{ return c.toDataURL("image/png"); }catch(e){ return null; }
  }

  /* Het lettertype moet geladen zijn vóór we tekenen, anders staat er een

  /* De <link>-iconen en het manifest opnieuw opbouwen. Gebeurt alleen als de
     naam is aangepast: bij de standaardnaam blijven de bestaande bestanden
     staan, en dan is er niets dat stuk kan gaan aan het installeren. */
  /* de oorspronkelijke verwijzingen, om op terug te vallen zodra de naam weer
     de standaardnaam is */
  var vasteLinks = (function(){
    var uit = {};
    ["icon", "apple-touch-icon"].forEach(function(soort){
      var el = document.querySelector('link[rel="' + soort + '"]');
      if(el) uit[soort] = el.getAttribute("href");
    });
    return uit;
  })();

  var EIGEN_CACHE = "rekenwereld-eigen";

  /* Het manifest houdt zijn gewone adres (./manifest.webmanifest); alleen de
     inhoud wisselt. De service worker kijkt eerst in deze cache, dus de browser
     ziet de aangepaste naam en het nieuwe icoon op een echt, vast adres — dat
     is wat hij nodig heeft om een geïnstalleerde app later bij te werken. */
  function bewaarManifest(doc, klaar){
    function af(){ if(klaar){ var k = klaar; klaar = null; k(); } }
    if(!window.caches || !window.Response){ af(); return; }
    try{
      caches.open(EIGEN_CACHE).then(function(c){
        return c.put("./manifest.webmanifest",
              new Response(JSON.stringify(doc),
                           {headers:{"Content-Type":"application/manifest+json"}}));
      }).then(af, af);
    }catch(e){ af(); }
    /* nooit eindeloos blijven wachten op de cache */
    setTimeout(af, 2500);
  }

  function wisEigenManifest(){
    if(!window.caches) return;
    try{
      caches.open(EIGEN_CACHE).then(function(c){
        c.delete("./manifest.webmanifest").catch(function(){});
      }).catch(function(){});
    }catch(e){}
  }

  function eigenUiterlijk(){ return S.naam !== NAAM || S.icoonKleur !== ICOONKLEUR; }

  function zetAppIcoon(klaar){
    if(!eigenUiterlijk()){
      Object.keys(vasteLinks).forEach(function(soort){
        var el = document.querySelector('link[rel="' + soort + '"]');
        if(el) el.href = vasteLinks[soort];
      });
      wisEigenManifest();
      if(klaar) setTimeout(klaar, 0);
      return;
    }
    metLettertype(function(){
      var i192 = tekenIcoon(S.naam, 192, 1);
      var i512 = tekenIcoon(S.naam, 512, 1);
      var iMask = tekenIcoon(S.naam, 512, 0.68);
      if(!i192 || !i512 || !iMask){ if(klaar) klaar(); return; }

      var icoon = document.querySelector('link[rel="icon"]');
      if(icoon) icoon.href = i192;
      var appel = document.querySelector('link[rel="apple-touch-icon"]');
      if(appel) appel.href = tekenIcoon(S.naam, 180, 1) || i192;

      /* verwijzingen absoluut, zodat ze kloppen waar de app ook staat */
      bewaarManifest({
        name: appTitel(),
        short_name: "Rekenwereld",
        description: "Oefenen met plus, min, keer, deel, de tafels en klokkijken. " +
                     "Punten sparen voor stickers en beloningen.",
        lang: "nl", dir: "ltr",
        /* De naam, de kleur en de groep reizen mee in het startadres. Een app op
           het beginscherm opent altijd dat adres, dus komt hij hoe dan ook met de
           goede instellingen op — ook als hij de opslag van de browser niet ziet.
           Bij het opstarten worden ze alleen gebruikt als er nog niets bewaard is. */
        start_url: new URL("./index.html", location.href).href +
                   "?naam=" + encodeURIComponent(S.naam) +
                   "&kleur=" + encodeURIComponent(S.icoonKleur) +
                   "&groep=" + S.leerjaar,
        scope: new URL("./", location.href).href,
        display: "standalone",
        display_override: ["standalone", "fullscreen", "minimal-ui"],
        orientation: "any",
        background_color: "#F4F8FD",
        theme_color: "#F4F8FD",
        categories: ["education", "kids"],
        icons: [
          {src: i192,  sizes: "192x192", type: "image/png", purpose: "any"},
          {src: i512,  sizes: "512x512", type: "image/png", purpose: "any"},
          {src: iMask, sizes: "512x512", type: "image/png", purpose: "maskable"}
        ]
      }, klaar);
    });
  }

  /* Het installatievenster van de browser openen, en eerlijk vertellen wat eruit
     komt. Gebeurt er niets of wijst de gebruiker het af, dan tonen we de route
     via het menu — anders lijkt het alsof installeren niet kan. */
  function vraagInstallatie(naAfloop){
    if(!wachtendeVraag){ toonInstalleren(); return; }
    var vraag = wachtendeVraag;
    wachtendeVraag = null;              /* een prompt mag maar één keer gebruikt worden */
    var beantwoord = false;

    try{
      vraag.prompt();
    }catch(e){
      toonInstalleren();
      toast("Het installatievenster ging niet open. Hieronder staat hoe het met de hand kan.");
      return;
    }

    /* geen antwoord binnen tien tellen? dan is er iets blijven hangen */
    var wachter = setTimeout(function(){
      if(beantwoord) return;
      toonInstalleren();
      toast("Er gebeurde niets. Probeer het via het menu van je browser.");
    }, 10000);

    vraag.userChoice.then(function(keuze){
      beantwoord = true;
      clearTimeout(wachter);
      installKnop.hidden = true;
      if(keuze && keuze.outcome === "accepted"){
        if(naAfloop) naAfloop();
        return;
      }
      /* afgewezen of weggeklikt */
      toonInstalleren();
      toast("Niet geïnstalleerd. Hieronder staat hoe het via het menu kan.");
    }).catch(function(){
      beantwoord = true;
      clearTimeout(wachter);
      toonInstalleren();
    });
  }

      '<p class="uitlegregel" style="margin:0 0 10px">Dit werkt het best in <b>Chrome</b>.</p>' +
      '<ol class="stappen">' +
      '<li>Tik rechtsboven op de drie puntjes <b>⋮</b>.</li>' +
      '<li>Kies <b>App installeren</b>, of anders <b>Toevoegen aan startscherm</b>.</li>' +
      '<li>Bevestig met <b>Installeren</b>.</li></ol></div>';

    var html = '<section class="sectie"><h2>De app op je tablet zetten</h2>';
    html += '<p class="uitlegregel">Daarna opent hij zonder adresbalk, met een eigen icoon, ' +
            'en werkt hij ook zonder internet.</p>';
    if(S.naam !== NAAM){
      html += '<p class="uitlegregel"><b>Nieuw icoon met de naam ' + veiligeTekst(S.naam) + '?</b> ' +
              'Haal de app dan eerst van het beginscherm af — houd het icoon ingedrukt en kies ' +
              'verwijderen — en zet hem daarna opnieuw neer. Anders blijft het oude icoon staan ' +
              'tot de tablet hem uit zichzelf bijwerkt.</p>';
    }
    html += '</section>';

    if(wachtendeVraag){
      html += '<div class="knoppen" style="margin-bottom:18px">' +
              '<button class="knop" type="button" id="nu-installeren">Nu installeren</button></div>';
    }
    html += '<div class="uitleglijst">' + (appleEerst ? apple + android : android + apple) + '</div>';
    html += '<div class="kaart uitlegblok" style="margin-top:18px"><h3>Lukt het niet?</h3>' +
            '<ul class="stappen" style="list-style:disc">' +
            '<li><b>Staat hij er misschien al?</b> Kijk op je beginscherm en in de app-lijst naar ' +
            'het icoon met <b>' + veiligeTekst(S.naam) + '</b>. Een tweede keer installeren doet dan niets.</li>' +
            '<li><b>Op een Samsung:</b> gebruik <b>Chrome</b>, niet Samsung Internet. Die laatste ' +
            'zet er vaak alleen een snelkoppeling neer in plaats van de app.</li>' +
            '<li><b>Niets zichtbaars gebeurd?</b> Ververs de pagina één keer en probeer het opnieuw. ' +
            'De app moet eerst helemaal geladen zijn.</li>' +
            '<li><b>Blijft het misgaan?</b> Het menu-item <b>Toevoegen aan startscherm</b> werkt ' +
            'altijd, ook als <b>App installeren</b> het laat afweten.</li>' +
            '</ul></div>';
    html += '<div class="knoppen" style="margin-top:18px">' +
            '<button class="knop stil" type="button" id="terug">Terug</button></div>';

    scherm.innerHTML = html;
    var nu = document.getElementById("nu-installeren");
    if(nu) nu.addEventListener("click", function(){ vraagInstallatie(toonHome); });
    document.getElementById("terug").addEventListener("click", toonHome);
  }

  /* ----- versie tonen en bijwerken ----- */
  function toonVersie(extra){
    var el = document.getElementById("versie");
    if(el) el.textContent = appTitel() + " · versie " + APPVERSIE + (extra ? " · " + extra : "");
  }

  /* Of er bij het laden al een service worker de baas was. Dat moet één keer
     vastgelegd worden: sw.js neemt met skipWaiting meteen over, dus even later is
     de controller ook bij een eerste installatie al gezet — en dan zou de app bij
     de allereerste start melden dat er een nieuwe versie is. */
  var alGeinstalleerd = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  /* de registratie, zodat de knop in de instellingen zelf kan gaan kijken */
  var swReg = null;

  function meldNieuweVersie(reg){
    if(!alGeinstalleerd) return;          /* eerste installatie is geen update */
    var balk = document.getElementById("nieuwe-versie");
    if(!balk || !balk.hidden) return;
    balk.hidden = false;
    document.getElementById("nu-verversen").addEventListener("click", function(){
      /* de wachtende versie mag het meteen overnemen; anders pas bij de volgende start */
      if(reg && reg.waiting) reg.waiting.postMessage("neem-over");
      setTimeout(function(){ location.reload(); }, 120);
    });
  }

  /* offline bruikbaar maken */
  if("serviceWorker" in navigator && zelfGehost){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").then(function(reg){
        if(!reg) return;
        swReg = reg;
        /* staat er al een nieuwe versie klaar? */
        if(reg.waiting && navigator.serviceWorker.controller) meldNieuweVersie(reg);
        reg.addEventListener("updatefound", function(){
          var verse = reg.installing;
          if(!verse) return;
          verse.addEventListener("statechange", function(){
            /* geïnstalleerd naast een bestaande versie = er is echt iets nieuws */
            if(verse.state === "installed" && navigator.serviceWorker.controller) meldNieuweVersie(reg);
          });
        });
        /* elke start één keer kijken of er iets nieuws op de server staat */
        try{ reg.update(); }catch(e){}
      }).catch(function(){});
    });
  }

  /* ----- starten ----- */
  laad();
  neemUitAdres();
  zetAppNaam();
  zetAppIcoon();
  ververGeluid();
  tekenScore();
  /* net ingericht en herladen: dan alleen nog de knop om te installeren */
  var netIngericht = false;
  try{ netIngericht = sessionStorage.getItem("net-ingericht") === "1"; }catch(e){}
  if(netIngericht && !alsApp()) toonInstallatiestap();
  else toonHome();
  laadschermWeg();
})();
</script>

</body>
</html>
