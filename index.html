  /* Groep raden uit opslag van vóór het niveausysteem, zodat een bestaande
     installatie na de update precies zo moeilijk blijft als hij was. */
  function raadLeerjaar(r){
    var tot = 20;
    ["plus","min"].forEach(function(id){
      if(r.bereik && r.bereik[id] && r.bereik[id].tot > tot) tot = r.bereik[id].tot;
    });
    var lj = tot <= 20 ? 3 : tot <= 100 ? 4 : tot <= 1000 ? 5 : tot <= 10000 ? 6 : 7;
    if(r.klokNiveau === 3 && lj < 5) lj = 5;
    if(r.bereik && r.bereik.keer && r.bereik.keer.tot > 12 && lj < 6) lj = 6;
    return lj;
  }

  function schoonGetal(waarde, laag, hoog, terugval){
    waarde = Math.round(Number(waarde));
    if(!isFinite(waarde)) return terugval;
    return Math.max(laag, Math.min(hoog, waarde));
  }

  /* Een naam mag letters, spaties, koppeltekens en apostrofs bevatten, en niet
     langer zijn dan op het icoon past. Levert "" als er niets bruikbaars staat,
     zodat de aanroeper op de standaardnaam kan terugvallen. */
  function schoonNaam(waarde){
    if(typeof waarde !== "string") return "";
    var n = waarde.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ' \-]/g, "").replace(/\s+/g, " ").trim();
    return n.slice(0, 12);
  }

  function kleurBestaat(id){
    var uit = false;
    ICOONKLEUREN.forEach(function(k){ if(k.id === id) uit = true; });
    return uit;
  }

  function icoonThema(){
    var uit = ICOONKLEUREN[0];
    ICOONKLEUREN.forEach(function(k){ if(k.id === S.icoonKleur) uit = k; });
    return uit;
  }

  /* Dezelfde datumvorm als bij het afvinken van een beloning: jaar-maand-dag,
     zonder voorloopnullen, zodat velDatum hem kan lezen. */
  function datumVan(d){
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  function vandaagDatum(nu){ return datumVan(nu || new Date()); }

  function gisterenDatum(nu){
    var d = new Date(nu || new Date());
    d.setDate(d.getDate() - 1);
    return datumVan(d);
  }

  /* Eén goed of fout antwoord telt als oefenen vandaag. Was het gisteren ook, dan
     loopt de reeks door; sloeg je een dag over, dan begint hij opnieuw bij één. */
  function noteerDag(nu){
    var d = S.dagen, vandaag = vandaagDatum(nu);
    if(d.laatste === vandaag){ d.vandaag++; return; }
    d.reeks = d.laatste === gisterenDatum(nu) ? d.reeks + 1 : 1;
    d.laatste = vandaag;
    d.vandaag = 1;
  }

  /* De reeks is alleen nog geldig als er vandaag of gisteren geoefend is. */
  function dagReeks(nu){
    var d = S.dagen;
    if(!d.laatste) return 0;
    if(d.laatste === vandaagDatum(nu) || d.laatste === gisterenDatum(nu)) return d.reeks;
    return 0;
  }

  function dagVandaag(nu){
    return S.dagen.laatste === vandaagDatum(nu) ? S.dagen.vandaag : 0;
  }

  /* Welk schooljaar er nu loopt. Vanaf 31 juli hoort een nieuw jaar erbij, want
     dan is het oude schooljaar afgelopen. */
  function schooljaar(nu){
    var d = nu || new Date();
    var m = d.getMonth(), dag = d.getDate(), jaar = d.getFullYear();
    return (m > 6 || (m === 6 && dag >= 31)) ? jaar : jaar - 1;
  }

  /* Moet er gevraagd worden of de groep omhoog gaat? Alleen als dit schooljaar nog
     niet beantwoord is, en alleen zolang er een groep bóven de huidige bestaat. */
  function groepVraagOpen(){
    if(!S.leerjaarGekozen || S.leerjaar >= 8) return false;
    return schooljaar() > S.groepGevraagd;
  }

  /* "Saar" wordt "Saar's Rekenwereld", maar een naam op s, x of z krijgt alleen
     een apostrof: "Mats' Rekenwereld". */
  function appTitel(){
    var n = S.naam || NAAM;
    return n + (/[sxz]$/i.test(n) ? "'" : "'s") + " Rekenwereld";
  }

  /* Voor tekst die in innerHTML terechtkomt. De naam is al geschoond, maar een
     apostrof hoort ook dan niet rauw in een attribuut. */
  function veiligeTekst(t){
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /* ----- geluid ----- */
  var ac = null;
  function piep(tonen, duur){
    if(!S.geluid) return;
    try{
      if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if(ac.state === "suspended") ac.resume();
      tonen.forEach(function(f, n){
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = "triangle";
        o.frequency.value = f;
        var t0 = ac.currentTime + n * duur;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + duur);
        o.connect(g); g.connect(ac.destination);
        o.start(t0); o.stop(t0 + duur + 0.02);
      });
    }catch(e){}
  }
  var klankGoed  = function(){ piep([660, 880], 0.11); };
  var klankFout  = function(){ piep([200], 0.22); };
  var klankSticker = function(){ piep([523, 659, 784, 1047], 0.1); };
  var klankBeloning = function(){ piep([523, 659, 784, 1047, 1319], 0.14); };
  var klankSuper = function(){ piep([659, 784, 1047, 1319, 1568, 2093], 0.13); };

  /* ----- sommen ----- */
  function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }

  function schud(lijst){
    for(var i = lijst.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var h = lijst[i]; lijst[i] = lijst[j]; lijst[j] = h;
    }
    return lijst;
  }

  /* ----- klok ----- */
  var UURNAAM     = R.UURNAAM;
  var NIVEAUS     = R.NIVEAUS;

  var KLOKSOORTEN = R.KLOKSOORTEN;

  function volgendUur(u){ return u === 12 ? 1 : u + 1; }

  function digitaal(u, m){ return u + ":" + (m < 10 ? "0" + m : m); }

  function inWoorden(u, m){
    var na = UURNAAM[u % 12 === 0 ? 12 : u % 12];
    var vo = UURNAAM[volgendUur(u) % 12 === 0 ? 12 : volgendUur(u) % 12];
    if(m === 0)  return na + " uur";
    if(m === 15) return "kwart over " + na;
    if(m === 30) return "half " + vo;
    if(m === 45) return "kwart voor " + vo;
    if(m < 15)   return m + " over " + na;
    if(m < 30)   return (30 - m) + " voor half " + vo;
    if(m < 45)   return (m - 30) + " over half " + vo;
    return (60 - m) + " voor " + vo;
  }

  function klokSVG(u, m, groot){
    var mid = 100, s = "";
    function punt(hoek, straal){
      var a = (hoek - 90) * Math.PI / 180;
      return [mid + straal * Math.cos(a), mid + straal * Math.sin(a)];
    }
    s += '<svg viewBox="0 0 200 200" role="img" aria-label="klok">';
    s += '<circle class="k-wijzer" cx="100" cy="100" r="91"/>';
    var i, p1, p2;
    for(i = 0; i < 60; i++){
      if(i % 5 === 0) continue;
      p1 = punt(i * 6, 78); p2 = punt(i * 6, 84);
      s += '<line class="k-streep" x1="' + p1[0].toFixed(1) + '" y1="' + p1[1].toFixed(1) +
           '" x2="' + p2[0].toFixed(1) + '" y2="' + p2[1].toFixed(1) + '"/>';
    }
    for(i = 0; i < 12; i++){
      p1 = punt(i * 30, 72); p2 = punt(i * 30, 84);
      s += '<line class="k-streep-u" x1="' + p1[0].toFixed(1) + '" y1="' + p1[1].toFixed(1) +
           '" x2="' + p2[0].toFixed(1) + '" y2="' + p2[1].toFixed(1) + '"/>';
    }
    for(i = 1; i <= 12; i++){
      if(!groot && i % 3 !== 0) continue;
      p1 = punt(i * 30, 57);
      s += '<text class="k-cijfer" x="' + p1[0].toFixed(1) + '" y="' + p1[1].toFixed(1) + '" text-anchor="middle" ' +
           'dominant-baseline="central" font-size="' + (groot ? 22 : 26) + '">' + i + '</text>';
    }
    var uh = punt(((u % 12) * 30) + (m * 0.5), 44);
    var mh = punt(m * 6, 70);
    s += '<line class="k-minuut" x1="100" y1="100" x2="' + mh[0].toFixed(1) + '" y2="' + mh[1].toFixed(1) + '"/>';
    s += '<line class="k-uur" x1="100" y1="100" x2="' + uh[0].toFixed(1) + '" y2="' + uh[1].toFixed(1) + '"/>';
    s += '<circle class="k-pin" cx="100" cy="100" r="7"/>';
    s += '</svg>';
    return s;
  }

  /* wens mag {niveau, soort, u, m} bevatten; challenges en herkansingen zetten die vast */
  function maakKlokvraag(wens){
    wens = wens || {};
    var n = NIVEAUS[wens.niveau || S.klokNiveau] || NIVEAUS[1];
    var u = wens.u || rnd(1, 12);
    var m = (typeof wens.m === "number") ? wens.m : n.minuten[rnd(0, n.minuten.length - 1)];
    if(n.minuten.indexOf(m) === -1) n = NIVEAUS[3];   /* bewaarde tijd past niet in dit niveau */
    var juist = {u:u, m:m};

    /* afleiders: de fouten die kinderen echt maken */
    var kandidaten = [
      {u:volgendUur(u), m:m},                                   /* "half vier" verward met 4 uur */
      {u:u === 1 ? 12 : u - 1, m:m},
      {u:u, m:(m + 30) % 60},                                   /* wijzers omgewisseld */
      {u:u, m:n.minuten[(n.minuten.indexOf(m) + 1) % n.minuten.length]},
      {u:u, m:n.minuten[(n.minuten.indexOf(m) + n.minuten.length - 1) % n.minuten.length]},
      {u:volgendUur(volgendUur(u)), m:m},
      {u:u, m:(60 - m) % 60}
    ];
    var afleiders = [], gezien = {};
    gezien[u + "-" + m] = true;
    schud(kandidaten).forEach(function(k){
      var sl = k.u + "-" + k.m;
      if(gezien[sl] || afleiders.length >= 3) return;
      gezien[sl] = true;
      afleiders.push(k);
    });
    while(afleiders.length < 3){
      var extra = {u:rnd(1,12), m:n.minuten[rnd(0, n.minuten.length - 1)]};
      if(gezien[extra.u + "-" + extra.m]) continue;
      gezien[extra.u + "-" + extra.m] = true;
      afleiders.push(extra);
    }

    var opties = schud(afleiders.concat([juist]));
    var index = 0;
    opties.forEach(function(o, k){ if(o.u === u && o.m === m) index = k; });

    var vorm, keuze = wens.soort || S.klokSoort;
    if(keuze === "analoog") vorm = "lezen";
    else if(keuze === "digitaal") vorm = "zetten";
    else vorm = Math.random() < 0.5 ? "lezen" : "zetten";

    return {
      groep: "klok",
      vorm: "keuze",
      lijf: "klok",
      soort: "klok",
      variant: vorm,
      u: u, m: m,
      opties: opties,
      juist: index,
      kleur: "var(--klok)",
      sleutel: "klok-" + u + "-" + m,
      label: "klok " + digitaal(u, m),
      oplossing: digitaal(u, m) + " — " + inWoorden(u, m)
    };
  }

  /* ---------- de vier basisbewerkingen ----------
     Deze houden hun handmatige van/tot-bereik uit de instellingen; de rest van de
     onderwerpen haalt zijn moeilijkheid uit het leerjaar. */
  function pakBereik(id, wens){
    if(wens && wens.bereik && wens.bereik[id]) return wens.bereik[id];
    return S.bereik[id];
  }

  function maakPlus(lj, wens){
    var r = pakBereik("plus", wens);
    var a = kies(wens, "a", function(){ return rnd(r.van, r.tot); });
    var b = kies(wens, "b", function(){ return rnd(r.van, r.tot); });
    return {groep:"plus", vorm:"getal", lijf:"som", a:a, b:b, op:"+", ant:a + b, kleur:"var(--gras)",
            label:a + " + " + b, oplossing:a + " + " + b + " = " + (a + b)};
  }

  function maakMin(lj, wens){
    var r = pakBereik("min", wens);
    var a = kies(wens, "a", function(){ return rnd(r.van, r.tot); });
    var b = kies(wens, "b", function(){ return rnd(r.van, r.tot); });
    if(b > a){ var t = a; a = b; b = t; }   /* nooit onder nul */
    return {groep:"min", vorm:"getal", lijf:"som", a:a, b:b, op:"−", ant:a - b, kleur:"var(--zee)",
            label:a + " − " + b, oplossing:a + " − " + b + " = " + (a - b)};
  }

  function maakKeer(lj, wens){
    var r = pakBereik("keer", wens);
    var a = kies(wens, "a", function(){ return rnd(r.van, r.tot); });
    var b = kies(wens, "b", function(){ return rnd(r.van, r.tot); });
    return {groep:"keer", vorm:"getal", lijf:"som", a:a, b:b, op:"×", ant:a * b, kleur:"var(--druif)",
            label:a + " × " + b, oplossing:a + " × " + b + " = " + (a * b)};
  }

  function maakDeel(lj, wens){
    var r = pakBereik("deel", wens);
    var b = kies(wens, "b", function(){ return rnd(Math.max(1, r.van), Math.max(1, r.tot)); });
    var u = kies(wens, "q", function(){ return rnd(r.van, r.tot); });
    return {groep:"deel", vorm:"getal", lijf:"som", a:b * u, b:b, op:":", ant:u, kleur:"var(--framboos)",
            label:(b * u) + " : " + b, oplossing:(b * u) + " : " + b + " = " + u};
  }

  function maakTafel(lj, wens){
    var lijst = (wens && wens.tafels && wens.tafels.length) ? wens.tafels : S.tafels;
    var t = kies(wens, "tafel", function(){
      return lijst.length ? lijst[rnd(0, lijst.length - 1)] : rnd(1, 10);
    });
    /* mult is de vermenigvuldiger; welke kant hij staat wisselt, dus hem apart
       bewaren — anders bouwt de herkansing een andere som terug */
    var mult = kies(wens, "mult", function(){ return rnd(1, 10); });
    var om = kies(wens, "om", function(){ return Math.random() < 0.5 ? 1 : 0; });
    var links = om ? t : mult, rechts = om ? mult : t;
    return {groep:"tafels", vorm:"getal", lijf:"som", tafel:t, mult:mult, om:om,
            a:links, b:rechts, op:"×", ant:t * mult, kleur:"var(--zon)",
            label:links + " × " + rechts,
            oplossing:links + " × " + rechts + " = " + (t * mult)};
  }

  /* Elke generator kiest zijn toevalswaarden hierlangs. Staat de waarde al in de wens,
     dan wordt die gebruikt — zo is elke vraag te herbouwen uit een handvol getallen,
     en werkt de herkansing-challenge zonder extra code per onderwerp. */
  function kies(wens, naam, maker){
    if(wens && wens[naam] !== undefined && wens[naam] !== null) return wens[naam];
    return maker();
  }


  /* ---------- Slim met getallen ---------- */

  function maakOntbrekend(lj, wens){
    var p = par("ontbrekend", wens.leerjaar);
    var op = kies(wens, "op", function(){ return p.ops[rnd(0, p.ops.length - 1)]; });
    var a, b, ant, q;
    if(op === "+"){
      a = kies(wens, "a", function(){ return rnd(1, Math.floor(p.tot / 2)); });
      b = kies(wens, "b", function(){ return rnd(1, Math.floor(p.tot / 2)); });
      ant = a + b;
    } else if(op === "−"){
      a = kies(wens, "a", function(){ return rnd(3, p.tot); });
      b = kies(wens, "b", function(){ return rnd(1, a - 1); });
      ant = a - b;
    } else if(op === "×"){
      a = kies(wens, "a", function(){ return rnd(2, p.factor); });
      b = kies(wens, "b", function(){ return rnd(2, 10); });
      ant = a * b;
    } else {
      b = kies(wens, "b", function(){ return rnd(2, 10); });
      q = kies(wens, "q", function(){ return rnd(2, 10); });
      a = b * q; ant = q;
    }
    var gat = kies(wens, "gat", function(){ return ["a","b"][rnd(0,1)]; });
    return {groep:"getallen", vorm:"getal", lijf:"som",
            a:a, b:b, op:op, ant:ant, gat:gat, doel:(gat === "a" ? a : b),
            vraagje:"Welk getal hoort er?",
            sleutel:"ontb " + a + op + b + gat,
            label:a + " " + op + " " + b + " = " + ant,
            oplossing:a + " " + op + " " + b + " = " + ant};
  }

  function maakDubbel(lj, wens){
    var p = par("dubbel", wens.leerjaar);
    var half = kies(wens, "half", function(){ return rnd(0, 1); });
    var n = kies(wens, "n", function(){ return rnd(2, p.tot); });
    if(half){
      var geheel = n * 2;
      return {groep:"getallen", vorm:"getal", lijf:"vrij", ant:n, n:n, half:1,
              vraagje:"Reken uit",
              regel:'<span>de helft van ' + geheel + '</span><span class="op">=</span>{1}',
              sleutel:"half " + geheel,
              label:"de helft van " + geheel,
              oplossing:"de helft van " + geheel + " is " + n};
    }
    return {groep:"getallen", vorm:"getal", lijf:"vrij", ant:n * 2, n:n, half:0,
            vraagje:"Reken uit",
            regel:'<span>het dubbele van ' + n + '</span><span class="op">=</span>{1}',
            sleutel:"dub " + n,
            label:"het dubbele van " + n,
            oplossing:"het dubbele van " + n + " is " + (n * 2)};
  }

  /* Splitsen in twee vormen. Meestal één schema — een totaal met twee delen
     eronder, waarvan er één open staat. Bij kleine totalen komt daar af en toe
     een opgave tussen waarin álle splitsingen van een getal ingevuld worden;
     die rijen worden gerekend, niet uit een lijstje gehaald. */
  function maakSplitsen(lj, wens){
    var p = par("splitsen", wens.leerjaar);
    var alleTot = Math.min(p.alle || 0, p.tot);
    var soort = kies(wens, "soort", function(){
      return (alleTot >= 2 && Math.random() < (p.alleKans || 0)) ? "alle" : "schema";
    });

    if(soort === "alle"){
      /* Een misser van vóór deze vorm heeft alleen heel in het zaad. Dat getal
         kan groter zijn dan waar deze opgave voor bedoeld is, dus begrenzen we
         het — anders komt er ineens een lijst van twintig regels uit. */
      var top = Math.max(2, Math.min(alleTot,
                kies(wens, "heel", function(){ return rnd(2, alleTot); })));
      var rijen = [], antwoorden = [];
      for(var d = 0; d <= top; d++){ rijen.push(d); antwoorden.push(top - d); }
      return {groep:"getallen", vorm:"lijst", lijf:"splitslijst", soort:"alle",
              ant:top, heel:top, rijen:rijen, antwoorden:antwoorden,
              vraagje:"Splits het getal " + top,
              onder:"Vul elke regel aan tot " + top,
              sleutel:"spl alle " + top,
              label:"alle splitsingen van " + top,
              oplossing:"Elke regel moet samen " + top + " zijn."};
    }

    var heel = kies(wens, "heel", function(){ return rnd(p.van, p.tot); });
    var deel = kies(wens, "deel", function(){ return rnd(1, heel - 1); });
    var gaten = p.gaten || ["rechts"];
    var gat = kies(wens, "gat", function(){ return gaten[rnd(0, gaten.length - 1)]; });
    var deel2 = heel - deel;
    var doel = gat === "top" ? heel : (gat === "links" ? deel : deel2);
    return {groep:"getallen", vorm:"getal", lijf:"splits", soort:"schema",
            ant:doel, heel:heel, deel:deel, deel2:deel2, gat:gat,
            vraagje:gat === "top" ? "Welk getal hoort bovenaan?" : "Welk getal hoort erbij?",
            sleutel:"spl " + heel + "/" + deel + "/" + gat,
            label:heel + " = " + deel + " + " + deel2,
            oplossing:heel + " = " + deel + " + " + deel2};
  }

  function maakVergelijk(lj, wens){
    var p = par("vergelijk", wens.leerjaar);
    var somKant = kies(wens, "somKant", function(){ return (p.sommen && Math.random() < 0.45) ? 1 : 0; });
    var a = kies(wens, "a", function(){ return rnd(1, p.tot); });
    var b2 = kies(wens, "b2", function(){ return rnd(1, Math.max(2, Math.floor(p.tot / 3))); });
    var links, tl;
    if(somKant){ links = a + b2; tl = a + " + " + b2; }
    else { links = a; tl = String(a); }
    /* ongeveer een op de zes precies gelijk, anders leert een kind de =-knop negeren */
    var rechts = kies(wens, "rechts", function(){
      if(Math.random() < 0.17) return links;
      var stap = rnd(1, Math.max(2, Math.round(p.tot / 6)));
      return Math.max(1, links + (rnd(0,1) ? stap : -stap));
    });
    var teken = links < rechts ? "<" : links > rechts ? ">" : "=";
    return {groep:"getallen", vorm:"keuze", lijf:"vrij",
            a:a, b2:b2, somKant:somKant, rechts:rechts,
            opties:[{teken:"<", sub:"kleiner dan"}, {teken:">", sub:"groter dan"}, {teken:"=", sub:"even groot"}],
            juist:["<",">","="].indexOf(teken),
            vraagje:"Welk teken hoort ertussen?",
            zin:"Het bekje wijst altijd naar het grootste getal.",
            regel:'<span>' + tl + '</span><span class="op">?</span><span>' + rechts + '</span>',
            sleutel:"verg " + tl + "|" + rechts,
            label:tl + " ? " + rechts,
            oplossing:tl + " " + teken + " " + rechts};
  }

  function maakAfronden(lj, wens){
    var p = par("afronden", wens.leerjaar);
    var naar = kies(wens, "naar", function(){ return p.naar[rnd(0, p.naar.length - 1)]; });
    var getal = kies(wens, "getal", function(){
      var g = rnd(naar, naar * p.maal);
      if(!p.halven && g % 10 === 5) g += rnd(0,1) ? 1 : -1;   /* de 5-regel komt pas later */
      return g;
    });
    var ant = Math.round(getal / naar) * naar;
    var woord = {10:"tientallen", 100:"honderdtallen", 1000:"duizendtallen"}[naar];
    return {groep:"getallen", vorm:"getal", lijf:"vrij", ant:ant, getal:getal, naar:naar,
            vraagje:"Rond af op " + woord,
            zin:p.halven ? "Zit je precies op de helft? Dan rond je naar boven af." : "",
            regel:'<span>' + getal + '</span><span class="op">→</span>{1}',
            sleutel:"afr " + getal + "/" + naar,
            label:getal + " → " + woord,
            oplossing:getal + " afgerond op " + woord + " is " + ant};
  }

  function maakKomma(lj, wens){
    var p = par("komma", wens.leerjaar);
    var dec = kies(wens, "decimalen", function(){ return p.dec[rnd(0, p.dec.length - 1)]; });
    var f = Math.pow(10, dec);
    var op = kies(wens, "op", function(){ return p.ops[rnd(0, p.ops.length - 1)]; });
    var a = kies(wens, "a", function(){ return rnd(1, p.heel * f); });
    var b, ant, bHeel = false;
    if(op === "+"){ b = kies(wens, "b", function(){ return rnd(1, p.heel * f); }); ant = a + b; }
    else if(op === "−"){ b = kies(wens, "b", function(){ return rnd(1, Math.max(1, a - 1)); }); ant = a - b; }
    else if(op === "×"){ b = kies(wens, "b", function(){ return rnd(2, 9); }); ant = a * b; bHeel = true; }
    else { b = kies(wens, "b", function(){ return rnd(2, 9); }); a = Math.ceil(a / b) * b; ant = a / b; bHeel = true; }
    return {groep:"getallen", vorm:"komma", lijf:"som", decimalen:dec, bHeel:bHeel,
            a:a, b:b, op:op, ant:ant,
            vraagje:"Reken uit",
            sleutel:"kom " + a + op + b + "/" + dec,
            label:uitKlein(a, dec) + " " + op + " " + (bHeel ? b : uitKlein(b, dec)),
            oplossing:uitKlein(a, dec) + " " + op + " " + (bHeel ? b : uitKlein(b, dec)) +
                      " = " + uitKlein(ant, dec)};
  }

  function graden(n){ return (n < 0 ? "−" + Math.abs(n) : String(n)) + "°"; }

  function maakNegatief(lj, wens){
    var p = par("negatief", wens.leerjaar);
    var van = kies(wens, "van", function(){ return rnd(-p.tot, p.tot); });
    var stap = kies(wens, "stap", function(){ return rnd(1, p.stap); });
    var omhoog = kies(wens, "omhoog", function(){ return rnd(0, 1); });
    var naar = omhoog ? van + stap : van - stap;
    var vraagNaar = kies(wens, "vraagNaar", function(){ return rnd(0, 1); });
    if(vraagNaar){
      return {groep:"getallen", vorm:"getal", lijf:"vrij", minToets:true, ant:naar,
              van:van, stap:stap, omhoog:omhoog, vraagNaar:1,
              vraagje:"Hoe koud of warm wordt het?",
              zin:"Het is " + graden(van) + ". Het wordt " + stap + " graden " +
                  (omhoog ? "warmer" : "kouder") + ".",
              regel:'{1}<span class="eenheid">graden</span>',
              sleutel:"neg " + van + (omhoog ? "+" : "-") + stap,
              label:graden(van) + (omhoog ? " + " : " − ") + stap,
              oplossing:graden(van) + (omhoog ? " plus " : " min ") + stap + " graden is " + graden(naar)};
    }
    var laag = Math.min(van, naar), hoog = Math.max(van, naar);
    return {groep:"getallen", vorm:"getal", lijf:"vrij", ant:hoog - laag,
            van:van, stap:stap, omhoog:omhoog, vraagNaar:0,
            vraagje:"Hoeveel graden verschil?",
            zin:"In de nacht is het " + graden(laag) + " en overdag " + graden(hoog) + ".",
            regel:'{1}<span class="eenheid">graden</span>',
            sleutel:"negv " + van + "/" + naar,
            label:"van " + graden(laag) + " naar " + graden(hoog),
            oplossing:"van " + graden(laag) + " naar " + graden(hoog) + " is " + (hoog - laag) + " graden"};
  }

  function maakGemiddelde(lj, wens){
    var p = par("gemiddelde", wens.leerjaar);
    var hoeveel = kies(wens, "hoeveel", function(){ return rnd(3, p.hoeveel); });
    var gem = kies(wens, "gem", function(){ return rnd(4, p.tot); });
    /* Begin met alle getallen op het gemiddelde en verschuif daarna steeds evenveel
       van het ene naar het andere getal. De som blijft dan exact deelbaar, en geen
       enkel getal kan onder de 1 zakken. */
    var lijst = kies(wens, "lijst", function(){
      var uit = [], n, i, j, d;
      for(n = 0; n < hoeveel; n++) uit.push(gem);
      var beurten = rnd(2, hoeveel + 2);
      for(n = 0; n < beurten; n++){
        i = rnd(0, hoeveel - 1);
        j = rnd(0, hoeveel - 1);
        if(i === j) continue;
        d = Math.min(4, uit[i] - 1);
        if(d < 1) continue;
        d = rnd(1, d);
        uit[i] -= d;
        uit[j] += d;
      }
      return uit;
    });
    var som = 0;
    lijst.forEach(function(n){ som += n; });
    return {groep:"getallen", vorm:"getal", lijf:"vrij", ant:som / lijst.length,
            hoeveel:lijst.length, gem:gem, lijst:lijst,
            vraagje:"Wat is het gemiddelde?",
            zin:S.naam + " haalde deze punten: " + lijst.join(", ") + ".",
            regel:'{1}',
            sleutel:"gem " + lijst.join("-"),
            label:"gemiddelde van " + lijst.join(", "),
            oplossing:"samen " + som + ", gedeeld door " + lijst.length + " is " + (som / lijst.length)};
  }

  /* ---------- Meten, geld en tijd ---------- */

  var MAATEN      = R.MAATEN;

  function maakMeten(lj, wens){
    var p = par("meten", wens.leerjaar);
    var kan = [];
    MAATEN.forEach(function(m, n){ if(m.vanaf <= p.lj) kan.push(n); });
    var mi = kies(wens, "m", function(){ return kan[rnd(0, kan.length - 1)]; });
    var m = MAATEN[mi] || MAATEN[0];
    var omhoog = kies(wens, "omhoog", function(){ return (p.omhoog && Math.random() < 0.4) ? 1 : 0; });
    var n = kies(wens, "n", function(){ return rnd(1, p.tot); });
    var getoond, ant, vanE, naarE;
    if(omhoog){
      /* omhoog kan alleen met een veelvoud van de factor, anders komt er een komma uit */
      getoond = n * m.f; ant = n; vanE = m.naar; naarE = m.van;
    } else {
      getoond = n; ant = n * m.f; vanE = m.van; naarE = m.naar;
    }
    return {groep:"meten", vorm:"getal", lijf:"vrij", ant:ant, m:mi, n:n, omhoog:omhoog,
            vraagje:"Hoeveel " + naarE + " is dat?",
            regel:'<span>' + getoond + " " + vanE + '</span><span class="op">=</span>{1}' +
                  '<span class="eenheid">' + naarE + '</span>',
            sleutel:"meet " + getoond + vanE + naarE,
            label:getoond + " " + vanE + " → " + naarE,
            oplossing:getoond + " " + vanE + " = " + ant + " " + naarE};
  }

  function euro(cent){ return "€ " + uitKlein(cent, 2); }

  function zinLijst(lijst){
    if(lijst.length === 1) return lijst[0];
    return lijst.slice(0, -1).join(", ") + " en " + lijst[lijst.length - 1];
  }

  function maakGeld(lj, wens){
    var p = par("geld", wens.leerjaar);
    /* Is er zelf een nauwkeurigheid gekozen, dan geldt die in plaats van die
       van de groep. De vaste muntenlijst vervalt dan: die kent alleen hele
       euro's en zou nooit een half bedrag opleveren. */
    if(S.geldStap){
      p.stap = S.geldStap;
      p.helen = S.geldStap === 100;
      p.munten = null;
    }
    var aantal = kies(wens, "aantal", function(){ return p.drie ? rnd(2, 3) : 2; });
    var soort = kies(wens, "soort", function(){ return p.terug ? ["samen","terug"][rnd(0,1)] : "samen"; });
    var centen = kies(wens, "centen", function(){
      var uit = [];
      while(uit.length < aantal){
        uit.push(p.munten ? p.munten[rnd(0, p.munten.length - 1)]
                          : rnd(1, Math.floor(p.maxCent / (aantal + 1))) * p.stap);
      }
      return uit;
    });
    var totaal = 0;
    centen.forEach(function(c){ totaal += c; });
    var tonen = centen.map(function(c){ return euro(c); });
    /* Of er een komma nodig is hangt af van de bedragen zelf. Zo blijft een
       bewaarde vraag kloppen, ook als de nauwkeurigheid later verandert. */
    var alleHeel = true;
    centen.forEach(function(c){ if(c % 100 !== 0) alleHeel = false; });
    var dec = (p.helen && alleHeel) ? 0 : 2;

    if(soort === "samen"){
      return {groep:"geld", vorm:dec ? "komma" : "getal", lijf:"vrij", decimalen:dec,
              ant:dec ? totaal : totaal / 100, centen:centen, soort:"samen", aantal:aantal,
              vraagje:"Hoeveel kost dat samen?",
              zin:S.naam + " koopt " + zinLijst(tonen) + ".",
              regel:'<span class="eenheid">€</span>{1}',
              sleutel:"geld+" + centen.join("+"),
              label:tonen.join(" + "),
              oplossing:tonen.join(" + ") + " = " + euro(totaal)};
    }
    var biljetten = [500, 1000, 2000, 5000, 10000];
    var betaald = kies(wens, "betaald", function(){
      var n, i;
      for(i = 0; i < biljetten.length; i++){ if(biljetten[i] > totaal) return biljetten[i]; }
      return Math.ceil(totaal / 1000) * 1000 + 1000;
    });
    return {groep:"geld", vorm:"komma", lijf:"vrij", decimalen:2, ant:betaald - totaal,
            centen:centen, betaald:betaald, soort:"terug", aantal:aantal,
            /* niet "krijgt ze terug": de naam is instelbaar en kan ook een jongen zijn */
            vraagje:"Hoeveel geld krijgt " + S.naam + " terug?",
            zin:S.naam + " koopt " + zinLijst(tonen) + " en betaalt met " + euro(betaald) + ".",
            regel:'<span class="eenheid">€</span>{1}',
            sleutel:"geldT" + centen.join("+") + "/" + betaald,
            label:euro(betaald) + " − " + euro(totaal),
            oplossing:euro(betaald) + " − " + euro(totaal) + " = " + euro(betaald - totaal)};
  }

  function maakDuur(lj, wens){
    var p = par("duur", wens.leerjaar);
    var u1 = kies(wens, "u1", function(){ return rnd(1, 12); });
    var m1 = kies(wens, "m1", function(){ return rnd(0, Math.floor(59 / p.stap)) * p.stap; });
    var duur = kies(wens, "duur", function(){ return rnd(1, Math.floor(p.max / p.stap)) * p.stap; });
    /* de duur wordt getrokken en de eindtijd berekend; over het hele uur heen gaat dan vanzelf goed */
    var t1 = u1 * 60 + m1, t2 = t1 + duur;
    var u2 = Math.floor(t2 / 60) % 12; if(u2 === 0) u2 = 12;
    var m2 = t2 % 60;
    var zin = S.naam + " begint om " + digitaal(u1, m1) + " en stopt om " + digitaal(u2, m2) + ".";
    var duo = p.duo && duur >= 60;
    if(duo){
      return {groep:"meten", vorm:"duo", lijf:"vrij", doel:Math.floor(duur / 60),
              ant:Math.floor(duur / 60), ant2:duur % 60,
              u1:u1, m1:m1, duur:duur, klokken:[[u1,m1],[u2,m2]],
              vraagje:"Hoe lang duurt dat?",
              zin:zin, onder:"uur · min",
              regel:'{1}<span class="eenheid">uur</span>{2}<span class="eenheid">min</span>',
              sleutel:"duur " + t1 + "+" + duur,
              label:"van " + digitaal(u1,m1) + " tot " + digitaal(u2,m2),
              oplossing:"van " + digitaal(u1,m1) + " tot " + digitaal(u2,m2) + " is " +
                        Math.floor(duur / 60) + " uur en " + (duur % 60) + " minuten"};
    }
    return {groep:"meten", vorm:"getal", lijf:"vrij", ant:duur,
            u1:u1, m1:m1, duur:duur, klokken:[[u1,m1],[u2,m2]],
            vraagje:"Hoeveel minuten duurt dat?",
            zin:zin,
            regel:'{1}<span class="eenheid">minuten</span>',
            sleutel:"duur " + t1 + "+" + duur,
            label:"van " + digitaal(u1,m1) + " tot " + digitaal(u2,m2),
            oplossing:"van " + digitaal(u1,m1) + " tot " + digitaal(u2,m2) + " is " + duur + " minuten"};
  }

  var MAANDEN     = R.MAANDEN;
  var DAGEN       = R.DAGEN;

  function maakKalender(lj, wens){
    var p = par("kalender", wens.leerjaar);
    var soort = kies(wens, "soort", function(){ return p.soorten[rnd(0, p.soorten.length - 1)]; });

    if(soort === "maand"){
      var mi = kies(wens, "mi", function(){ return rnd(0, 11); });
      var m = MAANDEN[mi];
      return {groep:"meten", vorm:"getal", lijf:"vrij", ant:m.dagen, mi:mi, soort:"maand",
              vraagje:"Hoeveel dagen?",
              regel:'<span>' + m.naam + '</span><span class="op">=</span>{1}' +
                    '<span class="eenheid">dagen</span>',
              sleutel:"kal m" + mi,
              label:"dagen in " + m.naam,
              oplossing:m.naam + " heeft " + m.dagen + " dagen"};
    }
    if(soort === "weken"){
      var weken = kies(wens, "weken", function(){ return rnd(2, p.weken); });
      return {groep:"meten", vorm:"getal", lijf:"vrij", ant:weken * 7, weken:weken, soort:"weken",
              vraagje:"Hoeveel dagen is dat?",
              regel:'<span>' + weken + ' weken</span><span class="op">=</span>{1}' +
                    '<span class="eenheid">dagen</span>',
              sleutel:"kal w" + weken,
              label:weken + " weken in dagen",
              oplossing:weken + " weken is " + (weken * 7) + " dagen"};
    }
    /* welke dag is het over n dagen: vier dagen om uit te kiezen, waarvan één klopt */
    var di = kies(wens, "di", function(){ return rnd(0, 6); });
    var stap = kies(wens, "stap", function(){ return rnd(2, p.vooruit); });
    var uit = (di + stap) % 7;
    var keus = kies(wens, "keus", function(){
      var lijst = [uit], extra;
      while(lijst.length < 4){
        extra = rnd(0, 6);
        if(lijst.indexOf(extra) === -1) lijst.push(extra);
      }
      return schud(lijst);
    });
    return {groep:"meten", vorm:"keuze", lijf:"vrij", soort:"dag", di:di, stap:stap, keus:keus,
            opties:keus.map(function(d){ return {teken:DAGEN[d].slice(0, 2), sub:DAGEN[d]}; }),
            juist:keus.indexOf(uit),
            vraagje:"Welke dag is dat?",
            zin:"Vandaag is het " + DAGEN[di] + ".",
            regel:'<span>over ' + stap + ' dagen</span>',
            sleutel:"kal d" + di + "+" + stap,
            label:DAGEN[di] + " + " + stap + " dagen",
            oplossing:"over " + stap + " dagen is het " + DAGEN[uit]};
  }

  function maakOppervlakte(lj, wens){
    var p = par("oppervlakte", wens.leerjaar);
    var vierkant = kies(wens, "vierkant", function(){ return rnd(0, 1); });
    var a = kies(wens, "a", function(){ return rnd(2, p.tot); });
    var b = kies(wens, "b", function(){ return vierkant ? a : rnd(2, p.tot); });
    if(vierkant) b = a;
    var omtrek = kies(wens, "omtrek", function(){ return rnd(0, 1); });
    var vorm = vierkant ? "vierkant" : "rechthoek";
    var maten = vierkant ? ("zijde " + a + " cm") : (a + " cm bij " + b + " cm");
    if(omtrek){
      return {groep:"meten", vorm:"getal", lijf:"vrij", ant:2 * (a + b),
              a:a, b:b, vierkant:vierkant, omtrek:1,
              vraagje:"Hoe lang is de omtrek?",
              zin:"Een " + vorm + " van " + maten + ".",
              regel:'{1}<span class="eenheid">cm</span>',
              sleutel:"omt " + a + "x" + b,
              label:"omtrek " + a + " bij " + b,
              oplossing:"de omtrek is " + a + " + " + b + " + " + a + " + " + b + " = " + (2 * (a + b)) + " cm"};
    }
    return {groep:"meten", vorm:"getal", lijf:"vrij", ant:a * b,
            a:a, b:b, vierkant:vierkant, omtrek:0,
            vraagje:"Hoe groot is de oppervlakte?",
            zin:"Een " + vorm + " van " + maten + ".",
            regel:'{1}<span class="eenheid">cm²</span>',
            sleutel:"opp " + a + "x" + b,
            label:"oppervlakte " + a + " bij " + b,
            oplossing:"de oppervlakte is " + a + " × " + b + " = " + (a * b) + " cm²"};
  }

  /* ---------- Deel van een geheel ---------- */

  var NOEMERWOORD = R.NOEMERWOORD;

  function breukHtml(t, n){
    return '<span class="breuk"><i>' + t + '</i><i>' + n + '</i></span>';
  }

  function maakBreuk(lj, wens){
    var p = par("breuk", wens.leerjaar);
    var soort = kies(wens, "soort", function(){ return p.teller ? ["deel","breuk"][rnd(0,1)] : "deel"; });
    var noemer = kies(wens, "noemer", function(){ return p.noemers[rnd(0, p.noemers.length - 1)]; });
    var k = kies(wens, "k", function(){ return rnd(2, Math.max(2, Math.floor(p.tot / noemer))); });
    var geheel = noemer * k;
    if(soort === "deel" && NOEMERWOORD[noemer]){
      return {groep:"deel", vorm:"getal", lijf:"vrij", ant:k,
              soort:"deel", noemer:noemer, k:k,
              vraagje:"Reken uit",
              regel:'<span>' + NOEMERWOORD[noemer] + " " + geheel + '</span><span class="op">=</span>{1}',
              sleutel:"br1 " + noemer + "/" + geheel,
              label:NOEMERWOORD[noemer] + " " + geheel,
              oplossing:NOEMERWOORD[noemer] + " " + geheel + " is " + k};
    }
    var teller = kies(wens, "teller", function(){ return rnd(1, noemer - 1); });
    return {groep:"deel", vorm:"getal", lijf:"vrij", ant:teller * k,
            soort:"breuk", teller:teller, noemer:noemer, k:k,
            vraagje:"Hoeveel is dat?",
            regel:breukHtml(teller, noemer) + '<span> van ' + geheel + '</span><span class="op">=</span>{1}',
            sleutel:"br2 " + teller + "/" + noemer + "/" + geheel,
            label:teller + "/" + noemer + " van " + geheel,
            oplossing:teller + "/" + noemer + " van " + geheel + " is " + (teller * k)};
  }

  function ggd(a, b){ while(b){ var h = b; b = a % b; a = h; } return a; }

  function maakProcent(lj, wens){
    var p = par("procent", wens.leerjaar);
    var perc = kies(wens, "p", function(){ return p.percs[rnd(0, p.percs.length - 1)]; });
    var stap = 100 / ggd(perc, 100);      /* zo komt perc% van het grondtal altijd heel uit */
    var basis = kies(wens, "basis", function(){
      return stap * rnd(1, Math.max(2, Math.floor(p.tot / stap)));
    });
    var deel = basis * perc / 100;
    var soort = kies(wens, "soort", function(){ return p.korting ? ["van","korting"][rnd(0,1)] : "van"; });
    if(soort === "korting"){
      return {groep:"deel", vorm:"getal", lijf:"vrij", ant:basis - deel,
              p:perc, basis:basis, soort:"korting",
              vraagje:"Hoeveel betaal je dan?",
              zin:"Een spel kost € " + basis + " en er is " + perc + "% korting.",
              regel:'<span class="eenheid">€</span>{1}',
              sleutel:"proc- " + perc + "/" + basis,
              label:perc + "% korting op " + basis,
              oplossing:perc + "% van " + basis + " is " + deel + ", dus je betaalt € " + (basis - deel)};
    }
    return {groep:"deel", vorm:"getal", lijf:"vrij", ant:deel,
            p:perc, basis:basis, soort:"van",
            vraagje:"Reken uit",
            regel:'<span>' + perc + "% van " + basis + '</span><span class="op">=</span>{1}',
            sleutel:"proc " + perc + "/" + basis,
            label:perc + "% van " + basis,
            oplossing:perc + "% van " + basis + " is " + deel};
  }

  var SPULLEN     = R.SPULLEN;

  function maakVerhouding(lj, wens){
    var p = par("verhouding", wens.leerjaar);
    var si = kies(wens, "si", function(){ return rnd(0, SPULLEN.length - 1); });
    var aantal = kies(wens, "aantal", function(){ return rnd(2, 5); });
    var perStuk = kies(wens, "perStuk", function(){ return rnd(1, p.perStuk) * p.stap; });
    var gevraagd = kies(wens, "gevraagd", function(){
      var g = rnd(2, 10);
      return g === aantal ? g + 1 : g;
    });
    var spul = SPULLEN[si];
    var prijs = aantal * perStuk;
    return {groep:"verhaal", vorm:"komma", lijf:"vrij", decimalen:2, ant:gevraagd * perStuk,
            si:si, aantal:aantal, perStuk:perStuk, gevraagd:gevraagd,
            vraagje:"Wat kosten er " + gevraagd + "?",
            zin:aantal + " " + spul.mv + " kosten " + euro(prijs) + ".",
            regel:'<span class="eenheid">€</span>{1}',
            sleutel:"verh " + aantal + "/" + perStuk + "/" + gevraagd + "/" + si,
            label:aantal + " voor " + euro(prijs) + ", dus " + gevraagd,
            oplossing:"één " + spul.ev + " kost " + euro(perStuk) + ", dus " + gevraagd +
                      " kosten " + euro(gevraagd * perStuk)};
  }

  /* ---------- Rekenen: rest, deeltafels en verhaaltjes ---------- */

  function maakRest(lj, wens){
    var p = par("rest", wens.leerjaar);
    var b = kies(wens, "b", function(){ return rnd(2, p.deler); });
    var q = kies(wens, "q", function(){ return rnd(2, p.uitkomst); });
    var r = kies(wens, "r", function(){ return rnd(1, b - 1); });   /* rest 0 is flauw */
    if(r >= b) r = b - 1;
    if(r < 1) r = 1;
    var a = b * q + r;
    return {groep:"deel", vorm:"duo", lijf:"som", rest:true,
            a:a, b:b, op:":", ant:q, doel:q, ant2:r,
            vraagje:"Hoe vaak past het, en wat blijft er over?",
            onder:"keer · rest",
            sleutel:"rest " + a + ":" + b,
            label:a + " : " + b,
            oplossing:a + " : " + b + " = " + q + " rest " + r};
  }

  function maakDeeltafel(lj, wens){
    var lijst = (wens && wens.tafels && wens.tafels.length) ? wens.tafels : S.tafels;
    var t = kies(wens, "tafel", function(){
      return lijst.length ? lijst[rnd(0, lijst.length - 1)] : rnd(1, 10);
    });
    var q = kies(wens, "q", function(){ return rnd(1, 10); });
    return {groep:"deel", vorm:"getal", lijf:"som", tafel:t,
            a:t * q, b:t, op:":", ant:q,
            vraagje:"De tafel omgekeerd",
            sleutel:"dtaf " + (t * q) + ":" + t,
            label:(t * q) + " : " + t,
            oplossing:(t * q) + " : " + t + " = " + q};
  }

  var NAMEN       = R.NAMEN;

  var DINGEN      = R.DINGEN;

  /* De sjablonen kiezen geen getallen; die komen kant en klaar uit de rekenkern.
     Daardoor kan er nooit iets uitkomen als "geeft 40 van haar 12 knikkers weg". */
  var SJABLONEN   = R.SJABLONEN;
  var GROEPGETALLEN = R.GROEPGETALLEN;

  function vulSjabloon(tekst, x){
    var nm = x.naam, nm2 = x.naam2;
    return tekst
      .replace(/\{N2\}/g, nm2.n).replace(/\{N\}/g, nm.n)
      .replace(/\{Zij\}/g, nm.v ? "Ze" : "Hij").replace(/\{zij\}/g, nm.v ? "ze" : "hij")
      .replace(/\{haar\}/g, nm.v ? "haar" : "zijn")
      .replace(/\{bakmv\}/g, x.ding.bakmv).replace(/\{bak\}/g, x.ding.bak)
      /* het lidwoord hoort bij de verpakking en staat dus in de data, niet in de
         zin: anders wordt het "in het mand" en "in elk doos" */
      .replace(/\{lw\}/g, x.ding.lw).replace(/\{elk\}/g, x.ding.lw === "de" ? "elke" : "elk")
      .replace(/\{mv\}/g, x.ding.mv)
      .replace(/\{a\}/g, x.a).replace(/\{b\}/g, x.b);
  }

  function maakVerhaal(lj, wens){
    var p = par("verhaal", wens.leerjaar);
    var op = kies(wens, "op", function(){ return p.ops[rnd(0, p.ops.length - 1)]; });

    /* 1. de rekenkern: de getallen ontstaan onder de regels van de bewerking */
    var a, b, ant;
    if(op === "plus"){
      a = kies(wens, "a", function(){ return rnd(2, Math.floor(p.tot / 2)); });
      b = kies(wens, "b", function(){ return rnd(2, Math.floor(p.tot / 2)); });
      ant = a + b;
    } else if(op === "min"){
      a = kies(wens, "a", function(){ return rnd(3, p.tot); });
      b = kies(wens, "b", function(){ return rnd(1, a - 1); });   /* nooit meer weggeven dan je hebt */
      ant = a - b;
    } else if(op === "keer"){
      a = kies(wens, "a", function(){ return rnd(2, p.factor); });
      b = kies(wens, "b", function(){ return rnd(2, 10); });
      ant = a * b;
    } else {
      b = kies(wens, "b", function(){ return rnd(2, p.factor); });
      ant = kies(wens, "q", function(){ return rnd(2, 10); });
      a = b * ant;
    }

    /* 2. de inkleding: mag de getallen alleen nog een naam geven */
    var lijst = SJABLONEN[op];
    var si = kies(wens, "si", function(){ return rnd(0, lijst.length - 1); });
    var ni = kies(wens, "ni", function(){ return rnd(0, NAMEN.length - 1); });
    var ni2 = kies(wens, "ni2", function(){ return (ni + 1 + rnd(0, NAMEN.length - 2)) % NAMEN.length; });
    var di = kies(wens, "di", function(){ return rnd(0, DINGEN.length - 1); });
    var teken = {plus:"+", min:"−", keer:"×", deel:":"}[op];
    var zin = vulSjabloon(lijst[si], {naam:NAMEN[ni], naam2:NAMEN[ni2], ding:DINGEN[di], a:a, b:b});

    return {groep:"verhaal", vorm:"getal", lijf:"vrij", ant:ant,
            verhaalOp:op, a:a, b:b, si:si, ni:ni, ni2:ni2, di:di,
            zin:zin, regel:'{1}',
            sleutel:"vh " + op + a + "/" + b + "/" + si + "/" + di,
            label:a + " " + teken + " " + b,
            oplossing:a + " " + teken + " " + b + " = " + ant};
  }
  /* oude naam, voor het geval er nog ergens naar verwezen wordt */
  function maakSom(cat, eigenBereik, eigenTafels){
    return maakVraag(cat, {bereik:eigenBereik, tafels:eigenTafels});
  }

  /* ---------- de enige voordeur ---------- */
  function maakVraag(id, wens){
    wens = wens || {};
    if(id === "alles") id = kiesUitMix(wens);
    var o = ONDERWERPEN[id];
    if(!o) o = ONDERWERPEN.plus;
    var lj = wens.leerjaar || S.leerjaar;
    var v = o.maak(lj, wens);
    v.onderwerp = o.id;
    v.groep = v.groep || o.groep;
    v.kleur = v.kleur || o.kleur;
    v.vorm = v.vorm || "getal";
    v.lijf = v.lijf || "som";
    if(!v.sleutel) v.sleutel = o.id + " " + v.a + v.op + v.b;
    return v;
  }

  function kiesUitMix(wens){
    var mix = (wens && wens.mix) || actieveOnderwerpen();
    return mix.length ? mix[rnd(0, mix.length - 1)] : "plus";
  }

  /* technische identiteit, alleen voor dedupe binnen één ronde */
  function dedupeSleutel(v){
    return v.sleutel || ((v.onderwerp || v.groep) + " " + v.a + v.op + v.b);
  }

  /* Hoort deze misser bij de gekozen soort sommen? Bij "alles" telt elk onderwerp
     mee dat op dit moment op het beginscherm staat. */
  function misserPast(f, cat){
    var id = f.vraag && f.vraag.onderwerp;
    if(!id || !ONDERWERPEN[id]) return false;
    if(cat === "alles") return zichtbaar(id);
    return id === cat;
  }

  /* De missers die als eerste terug mogen komen: die het vaakst fout gingen staan
     vooraan in de lijst, dus de volgorde van S.stats.fouten is al de goede. */
  function herhaalVragen(cat, hoeveel){
    var uit = [];
    if(hoeveel < 1) return uit;
    S.stats.fouten.forEach(function(f){
      if(uit.length >= hoeveel || !misserPast(f, cat)) return;
      var v = herbouwVraag(f.vraag);
      if(v) uit.push(v);              /* rommel uit een oudere versie slaan we over */
    });
    return uit;
  }

  function maakRonde(cat){
    var lengte = S.rondeLengte;
    var lijst = [], gezien = {}, pogingen = 0;

    /* Eerst een paar missers, zodat wat fout ging vanzelf terugkomt in plaats van
       alleen in de herkansingschallenge. Nooit meer dan een derde van de ronde. */
    var herhaal = herhaalVragen(cat, Math.min(S.herhaalMissers, Math.floor(lengte / 3)));
    herhaal.forEach(function(v){ gezien[dedupeSleutel(v)] = true; });

    while(lijst.length < lengte - herhaal.length && pogingen < lengte * 30){
      pogingen++;
      var s = maakVraag(cat);
      var sl = dedupeSleutel(s);
      if(gezien[sl]) continue;
      gezien[sl] = true;
      lijst.push(s);
    }
    while(lijst.length < lengte - herhaal.length) lijst.push(maakVraag(cat));

    /* Ertussen schuiven, niet vooraan: de eerste vraag hoort een makkelijke start
       te zijn, en achteraan zou hij samenvallen met het einde van de reeks. */
    herhaal.forEach(function(v){
      lijst.splice(rnd(1, Math.max(1, lijst.length - 1)), 0, v);
    });
    return lijst;
  }

  /* ----- afgeleide score ----- */
  /* ----- voortgang bijhouden ----- */
  /* leesbaar: dit staat in het rapport en in de foutenlijst */
  function vraagSleutel(v){
    if(v.label) return v.label;
    if(v.groep === "klok") return "klok " + v.u + ":" + (v.m < 10 ? "0" + v.m : v.m);
    return v.a + " " + v.op + " " + v.b;
  }

  /* vragen.js beschrijft een zaad als doelveld -> bronveld; hier wordt dat een object */
  function zaadVan(kaart, v){
    var z = {}, doel;
    for(doel in kaart){
      if(Object.prototype.hasOwnProperty.call(kaart, doel)) z[doel] = v[kaart[doel]];
    }
    return z;
  }

  /* alleen de velden die nodig zijn om de vraag exact te herbouwen */
  function bewaarbaar(v){
    var o = ONDERWERPEN[v.onderwerp];
    if(o && o.zaad){
      var z = zaadVan(o.zaad, v) || {};
      z.onderwerp = v.onderwerp;
      z.leerjaar = S.leerjaar;     /* zodat een oude misser niet ineens zwaarder terugkomt */
      return z;
    }
    if(v.groep === "klok") return {groep:"klok", u:v.u, m:v.m};
    return {groep:v.groep, tafel:v.tafel, a:v.a, b:v.b, op:v.op, ant:v.ant, kleur:v.kleur};
  }

  function herbouwVraag(bewaard){
    try{
      if(bewaard.onderwerp && ONDERWERPEN[bewaard.onderwerp]){
        return maakVraag(bewaard.onderwerp, bewaard);
      }
      if(bewaard.groep === "klok") return maakKlokvraag({u:bewaard.u, m:bewaard.m});
      var v = {};
      for(var k in bewaard) if(Object.prototype.hasOwnProperty.call(bewaard, k)) v[k] = bewaard[k];
      v.vorm = v.vorm || "getal";
      v.lijf = v.lijf || "som";
      return v;
    }catch(e){
      return null;        /* rommel uit een oudere versie mag niets slopen */
    }
  }

  function noteer(v, juist){
    noteerDag();
    var g = S.stats.groep[v.groep];
    if(g){ g.totaal++; if(juist) g.goed++; }
    if(v.onderwerp){
      if(!S.stats.onderwerp[v.onderwerp]) S.stats.onderwerp[v.onderwerp] = {goed:0, totaal:0};
      var o = S.stats.onderwerp[v.onderwerp];
      o.totaal++; if(juist) o.goed++;
    }
    if(v.groep === "tafels" && S.stats.tafel[v.tafel]){
      S.stats.tafel[v.tafel].totaal++;
      if(juist) S.stats.tafel[v.tafel].goed++;
    }

    var sleutel = vraagSleutel(v);
    var plek = -1;
    S.stats.fouten.forEach(function(f, n){ if(f.sleutel === sleutel) plek = n; });
    if(juist){
      /* goed gemaakt: uit de herkansingslijst halen */
      if(plek !== -1){
        S.stats.fouten[plek].aantal--;
        if(S.stats.fouten[plek].aantal <= 0) S.stats.fouten.splice(plek, 1);
      }
      return;
    }
    if(plek !== -1){
      S.stats.fouten[plek].aantal++;
      S.stats.fouten.unshift(S.stats.fouten.splice(plek, 1)[0]);
    } else {
      S.stats.fouten.unshift({sleutel:sleutel, aantal:1, vraag:bewaarbaar(v)});
    }
    if(S.stats.fouten.length > MAX_FOUTEN) S.stats.fouten.length = MAX_FOUTEN;
  }

  function scoreVan(hok){
    if(!hok || !hok.totaal) return null;
    return Math.round(hok.goed / hok.totaal * 100);
  }

  function oordeel(hok){
    if(!hok || hok.totaal < 5) return {tekst:"Nog weinig geoefend", klasse:"leeg"};
    var p = scoreVan(hok);
    if(p >= 85) return {tekst:"Sterk", klasse:"sterk"};
    if(p >= 65) return {tekst:"Gaat goed", klasse:"goed"};
    return {tekst:"Meer oefenen", klasse:"aandacht"};
  }

  function zwaksteGroep(){
    var slechtste = null;
    GROEPEN.forEach(function(g){
      var hok = S.stats.groep[g.id];
      if(!hok || hok.totaal < 10) return;
      /* niet naar iets wijzen wat Saar niet eens op haar scherm heeft staan */
      if(ONDERWERPEN[g.id] && !zichtbaar(g.id)) return;
      var p = scoreVan(hok);
      if(slechtste === null || p < slechtste.p) slechtste = {id:g.id, p:p};
    });
    return slechtste;
  }

  function zwaksteTafels(hoeveel){
    var rij = [];
    for(var t = 1; t <= 10; t++){
      var hok = S.stats.tafel[t];
      rij.push({tafel:t, p:hok.totaal >= 4 ? scoreVan(hok) : 101 - t, totaal:hok.totaal});
    }
    rij.sort(function(a, b){ return a.p - b.p; });
    return rij.slice(0, hoeveel).map(function(r){ return r.tafel; }).sort(function(a, b){ return a - b; });
  }

  /* Sparen aan of uit. Staat het uit, dan telt de app alleen punten: geen
     stickers, geen stickervellen en geen beloningen. */
  function sparenAan(){ return S.sparen !== false; }

  /* Met hoeveel nauwkeurigheid de bedragen bij Geld gemaakt worden. 0 betekent:
     volg de groep, zoals de app het altijd deed. */
  var GELDSTAPPEN = [
    {stap:0,   naam:"volgt groep", uitleg:"de groep bepaalt hoe fijn de bedragen zijn"},
    {stap:100, naam:"hele euro's", uitleg:"alleen hele euro's, dus € 3 en € 12"},
    {stap:50,  naam:"halve euro's", uitleg:"hele en halve euro's, dus € 3,50"},
    {stap:1,   naam:"tot op de cent", uitleg:"elk bedrag, dus ook € 3,47"}
  ];

  /* Wanneer een goed antwoord een punt oplevert: meteen, of pas als de reeks af is. */
  var PUNTMOMENTEN = [
    {direct:true,  naam:"meteen",
     uitleg:"elk goed antwoord telt meteen mee; stop je halverwege, dan houd je wat je tot dan toe verdiend hebt"},
    {direct:false, naam:"pas na de reeks",
     uitleg:"de punten van een reeks komen er pas bij als de reeks helemaal af is; stop je halverwege, dan tellen ze niet mee"}
  ];

  /* Hoeveel eerder fout beantwoorde sommen er in een gewone ronde terugkomen. */
  var HERHALINGEN = [
    {aantal:0, naam:"niet",  uitleg:"missers komen alleen terug in de herkansingschallenge"},
    {aantal:1, naam:"soms",  uitleg:"er komt één eerdere misser per ronde terug"},
    {aantal:2, naam:"vaak",  uitleg:"er komen twee eerdere missers per ronde terug"}
  ];

  function herhaalGeldig(n){
    var goed = false;
    HERHALINGEN.forEach(function(h){ if(h.aantal === n) goed = true; });
    return goed;
  }

  function herhaalNu(){
    var uit = HERHALINGEN[1];
    HERHALINGEN.forEach(function(h){ if(h.aantal === S.herhaalMissers) uit = h; });
    return uit;
  }

  function geldStapGeldig(n){
    var goed = false;
    GELDSTAPPEN.forEach(function(g){ if(g.stap === n) goed = true; });
    return goed;
  }

  function stickers(){ return Math.floor(S.punten / S.puntenPerSticker) + S.bonusStickers; }
  function beloningen(){ return Math.floor(stickers() / S.stickersPerBeloning); }
  function puntenPerBeloning(){ return S.puntenPerSticker * S.stickersPerBeloning; }

  function tekenScore(){
    /* Staat het sparen uit, dan blijven alleen de punten over: de opmaak haalt de
       twee andere tegels weg en de regel eronder heeft dan niets te vertellen. */
    document.body.setAttribute("data-sparen", sparenAan() ? "aan" : "uit");
    document.getElementById("sc-punten").textContent = S.punten;
    /* Tellen de punten pas na de reeks, dan staat er onder de teller hoeveel
       er onderweg zijn. Zonder dat zou het lijken alsof goed rekenen niets doet. */
    var wacht = document.getElementById("sc-wacht");
    wacht.textContent = S.wachtpunten ? "+" + S.wachtpunten + " straks" : "";
    wacht.hidden = !S.wachtpunten;
    document.getElementById("sc-stickers").textContent = stickers();
    document.getElementById("sc-beloningen").textContent = beloningen();
    document.getElementById("regels").textContent = sparenAan()
      ? S.puntenPerSticker + (S.puntenPerSticker === 1 ? " punt" : " punten") + " = 1 sticker  ·  " +
        S.stickersPerBeloning + (S.stickersPerBeloning === 1 ? " sticker" : " stickers") + " = 1 beloning"
      : "";
  }

  /* ----- schermen ----- */
  var scherm = document.getElementById("scherm");

  function bereikTekst(id, woord){

  function klokKort(){
    var soort = S.klokSoort === "analoog" ? "Analoog aflezen"
              : S.klokSoort === "digitaal" ? "Digitale tijd zetten"
              : "Analoog en digitaal";

  }

  function tafelsKort(){
    var l = S.tafels.slice().sort(function(a, b){ return a - b; });
    if(!l.length) return "Kies je tafels";
    if(l.length === 10) return "Alle tafels van 1 t/m 10";
    if(l.length === 1) return "De tafel van " + l[0];
    if(l.length <= 4) return "De tafels van " + l.slice(0, -1).join(", ") + " en " + l[l.length - 1];
    return l.length + " tafels gekozen";
  }


  /* ---------- de eerste keer, in de browser ----------

  /* Alles vastleggen, en bij installeren de pagina herladen. Dat laatste moet:
     de browser leest het manifest één keer per paginabezoek, dus zonder herladen
     zou hij nog het oude icoon en de oude naam gebruiken bij het installeren. */
  function rondInrichtenAf(naamTekst, installeren){
    S.naam = schoonNaam(naamTekst) || NAAM;
    S.ingericht = true;
    S.groepGevraagd = schooljaar();
    zetGroep(S.ingerichtGroep || S.leerjaar);    /* zet ook de bereiken en tafels */
    zetAppNaam();
    bewaar();
    if(!installeren){ zetAppIcoon(); toonHome(); return; }
    try{ sessionStorage.setItem("net-ingericht", "1"); }catch(e){}
    /* eerst het manifest wegschrijven, dan pas herladen */
    zetAppIcoon(function(){ location.reload(); });
  }

  /* Na het herladen: alles staat klaar, nu alleen nog installeren. */
  function toonInstallatiestap(){
    verlaatRonde();
    zetSchermstand("inrichten");
    var html = '<section class="sectie inrichtkop"><h2>Alles staat klaar!</h2>' +
               '<p class="uitlegregel">Zet ' + veiligeTekst(appTitel()) + ' nu op je beginscherm. ' +

            '<img id="klaar-icoon" alt="Het app-icoon" width="120" height="120" ' +

            '</div></section>';
    html += '<div class="knoppen" style="margin-top:22px">' +

            '</div>';
