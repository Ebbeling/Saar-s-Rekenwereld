<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saar's Rekenwereld</title>
<meta name="description" content="Oefenen met plus, min, keer, deel, de tafels en klokkijken. Punten sparen voor stickers en beloningen.">

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F4F8FD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101C33" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rekenwereld">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<link rel="preload" href="./fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/lilita-one-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* lettertypes staan in de map zelf, zodat de app zonder internet hetzelfde blijft */
  @font-face{
    font-family:"Lilita One";
    src:url("./fonts/lilita-one-latin.woff2") format("woff2");
    font-weight:400;font-style:normal;font-display:swap;
  }
  @font-face{
    font-family:"Nunito";
    src:url("./fonts/nunito-latin.woff2") format("woff2");
    font-weight:400;font-style:normal;font-display:swap;
  }
  @font-face{
    font-family:"Nunito";
    src:url("./fonts/nunito-latin.woff2") format("woff2");
    font-weight:700;font-style:normal;font-display:swap;
  }
  @font-face{
    font-family:"Nunito";
    src:url("./fonts/nunito-latin.woff2") format("woff2");
    font-weight:900;font-style:normal;font-display:swap;
  }

  :root{
    --papier:#F4F8FD;
    --ruit:#DDE8F7;
    --inkt:#16244A;
    --inkt-zacht:#5D6E92;
    --kaart:#FFFFFF;
    --rand:rgba(22,36,74,.14);
    --schaduw:rgba(22,36,74,.22);
    --framboos:#FF4D6D;
    --gras:#1FB877;
    --zee:#2A94E8;
    --druif:#8B5CF6;
    --zon:#FFB61E;
    --klok:#FF7A3D;
    --alles:#16244A;
    --alles-diep:#05090F;
    --fout:#E23D5A;
    --goed:#1FB877;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --papier:#101C33;
      --ruit:#1C2C4B;
      --inkt:#EAF1FF;
      --inkt-zacht:#94A6C9;
      --kaart:#1A2843;
      --rand:rgba(255,255,255,.12);
      --schaduw:rgba(0,0,0,.45);
      --framboos:#FF6B85;
      --gras:#2FD08C;
      --zee:#49A8F3;
      --druif:#A98BFF;
      --zon:#FFC94D;
      --klok:#FF9463;
      --alles:#31497D;
      --alles-diep:#16244A;
      --goed:#2FD08C;
      --fout:#FF6B85;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --papier:#101C33;
    --ruit:#1C2C4B;
    --inkt:#EAF1FF;
    --inkt-zacht:#94A6C9;
    --kaart:#1A2843;
    --rand:rgba(255,255,255,.12);
    --schaduw:rgba(0,0,0,.45);
    --framboos:#FF6B85;
    --gras:#2FD08C;
    --zee:#49A8F3;
    --druif:#A98BFF;
    --zon:#FFC94D;
    --klok:#FF9463;
    --alles:#31497D;
    --alles-diep:#16244A;
    --goed:#2FD08C;
    --fout:#FF6B85;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  /* Een eigen display-regel wint van de standaard van de browser, waardoor een
     element met hidden tóch zichtbaar blijft. Deze regel sluit dat uit. */
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%;height:100%}
  body{
    margin:0;
    min-height:100%;
    font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--inkt);
    background-color:var(--papier);
    background-image:
      linear-gradient(var(--ruit) 1px, transparent 1px),
      linear-gradient(90deg, var(--ruit) 1px, transparent 1px);
    background-size:28px 28px;
    background-position:-1px -1px;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  /* als app op het beginscherm: geen tekstselectie of dubbeltik-zoom op knoppen */
  button{
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
  }
  .som,.digitaal,.klokhouder,.slots,.score,.stippen{
    -webkit-user-select:none;
    user-select:none;
  }
  .wrap{
    max-width:620px;
    margin:0 auto;
    padding-inline:calc(18px + env(safe-area-inset-left)) calc(18px + env(safe-area-inset-right));
    padding-block:calc(20px + env(safe-area-inset-top)) calc(48px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  /* ---------- kop ---------- */
  .kop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .logo{
    font-family:"Lilita One",Impact,sans-serif;
    font-size:clamp(28px,7vw,40px);
    line-height:1;
    letter-spacing:.01em;
    margin:0;
    text-wrap:balance;
  }
  .logo .w{color:var(--framboos)}
  .geluid{
    font:inherit;font-weight:700;font-size:14px;
    color:var(--inkt-zacht);
    background:var(--kaart);
    border:2px solid var(--rand);
    border-radius:999px;
    padding:7px 14px;
    cursor:pointer;
  }
  .geluid:hover{color:var(--inkt)}

  /* ---------- scorestrook ---------- */
  .score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .score div{
    background:var(--kaart);
    border:2px solid var(--rand);
    border-radius:14px;
    padding:10px 12px;
    text-align:center;
  }
  .score b{
    display:block;
    font-family:"Lilita One",Impact,sans-serif;
    font-size:26px;
    line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .score span{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--inkt-zacht)}
  .score .p b{color:var(--zee)}
  .score .s b{color:var(--framboos)}
  .score .b b{color:var(--zon)}

  h2{
    font-family:"Lilita One",Impact,sans-serif;
    font-weight:400;
    font-size:20px;
    margin:0 0 12px;
    letter-spacing:.02em;
  }
  .sectie{display:block}

  /* ---------- categorieknoppen ---------- */
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cat{
    font:inherit;
    text-align:left;
    cursor:pointer;
    border:none;
    border-radius:18px;
    padding:16px 16px 14px;
    color:#fff;
    background:var(--kleur);
    box-shadow:0 5px 0 var(--diep), 0 8px 16px var(--schaduw);
    display:flex;align-items:center;gap:14px;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .cat:active{transform:translateY(4px);box-shadow:0 1px 0 var(--diep), 0 3px 8px var(--schaduw)}
  .cat .teken{
    font-family:"Lilita One",Impact,sans-serif;
    font-size:34px;line-height:1;
    width:52px;height:52px;flex:none;
    display:grid;place-items:center;
    background:rgba(255,255,255,.22);
    border-radius:14px;
  }
  .cat .naam{font-family:"Lilita One",Impact,sans-serif;font-size:21px;letter-spacing:.02em;display:block}
  .cat .uitleg{font-size:13px;font-weight:700;opacity:.85;display:block;margin-top:1px}
  .cat.plus{--kleur:var(--gras);--diep:#12905B}
  .cat.min{--kleur:var(--zee);--diep:#1A6FB4}
  .cat.keer{--kleur:var(--druif);--diep:#6A3FD1}
  .cat.deel{--kleur:var(--framboos);--diep:#D22B4B}
  .cat.tafels{--kleur:var(--zon);--diep:#D38A00;color:#3A2600}
  .cat.tafels .teken{background:rgba(58,38,0,.14)}
  .cat.klok{--kleur:var(--klok);--diep:#C9531C}
  /* eigen tokens, want --inkt draait in het donker om en maakte de tekst onleesbaar */
  .cat.alles{--kleur:var(--alles);--diep:var(--alles-diep);color:#fff}
  .cat.breed{grid-column:1 / -1}

  /* de nieuwe onderwerpen: één bestaande kleur per tegel */
  .cat.ontbrekend{--kleur:var(--gras);--diep:#12905B}
  .cat.dubbel{--kleur:var(--zee);--diep:#1A6FB4}
  .cat.splitsen{--kleur:var(--gras);--diep:#12905B}
  .cat.vergelijk{--kleur:var(--zee);--diep:#1A6FB4}
  .cat.afronden{--kleur:var(--zee);--diep:#1A6FB4}
  .cat.komma{--kleur:var(--klok);--diep:#C9531C}
  .cat.negatief{--kleur:var(--zee);--diep:#1A6FB4}
  .cat.gemiddelde{--kleur:var(--gras);--diep:#12905B}
  .cat.geld{--kleur:var(--zon);--diep:#D38A00;color:#3A2600}
  .cat.geld .teken{background:rgba(58,38,0,.14)}
  .cat.meten{--kleur:var(--druif);--diep:#6A3FD1}
  .cat.duur{--kleur:var(--klok);--diep:#C9531C}
  .cat.kalender{--kleur:var(--framboos);--diep:#D22B4B}
  .cat.oppervlakte{--kleur:var(--gras);--diep:#12905B}
  .cat.breuk{--kleur:var(--druif);--diep:#6A3FD1}
  .cat.procent{--kleur:var(--framboos);--diep:#D22B4B}
  .cat.verhouding{--kleur:var(--zon);--diep:#D38A00;color:#3A2600}
  .cat.verhouding .teken{background:rgba(58,38,0,.14)}
  .cat.rest{--kleur:var(--framboos);--diep:#D22B4B}
  .cat.deeltafels{--kleur:var(--zee);--diep:#1A6FB4}
  .cat.verhaal{--kleur:var(--framboos);--diep:#D22B4B}

  /* compacte tegels voor de vakken buiten Rekenen */
  .cats.klein{gap:10px}
  .cat.compact{padding:12px 12px 11px;gap:11px}
  .cat.compact .teken{width:40px;height:40px;font-size:22px;border-radius:11px}
  .cat.compact .naam{font-size:16.5px;line-height:1.15}
  /* een icoon van meer dan één teken (0,5 of −5°) moet in het vakje passen */
  .cat .teken.lang{font-size:19px;letter-spacing:-.03em}
  .cat.compact .teken.lang{font-size:14px}

  /* ---------- beloningskaart ---------- */
  .kaart{
    background:var(--kaart);
    border:2px solid var(--rand);
    border-radius:20px;
    padding:18px;
  }
  .slots{display:grid;gap:10px;justify-items:center}
  .slot{
    width:100%;max-width:78px;
    aspect-ratio:1/1;
    border-radius:50%;
    display:grid;place-items:center;
    font-size:clamp(22px,6.5vw,30px);
    border:2px dashed var(--rand);
    color:var(--inkt-zacht);
  }
  .slot.vol{
    border:3px solid #fff;
    background:var(--sk);
    box-shadow:0 3px 8px var(--schaduw);
    transform:rotate(var(--dr));
  }
  .balk{margin-top:16px}
  .balk .rij{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--inkt-zacht);margin-bottom:6px}
  .spoor{height:12px;border-radius:999px;background:var(--ruit);overflow:hidden}
  .vulling{height:100%;border-radius:999px;background:var(--framboos);transition:width .5s cubic-bezier(.2,.9,.3,1)}

  /* ---------- tafelkiezer ---------- */
  .tafelgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px}
  .tafelknop{
    font-family:"Lilita One",Impact,sans-serif;
    font-size:22px;
    cursor:pointer;
    border:2px solid transparent;border-radius:14px;
    padding:15px 8px;
    color:#3A2600;background:var(--zon);
    box-shadow:0 4px 0 #D38A00;
    transition:transform .08s ease, box-shadow .08s ease, background .12s ease;
  }
  .tafelknop:active{transform:translateY(3px);box-shadow:0 1px 0 #D38A00}
  /* niet gekozen: leeg vakje, zodat in één oogopslag zichtbaar is wat aanstaat */
  .tafelknop.uit{
    background:var(--kaart);
    color:var(--inkt-zacht);
    border-color:var(--rand);
    box-shadow:0 4px 0 var(--rand);
  }
  .tafelknop.uit:active{box-shadow:0 1px 0 var(--rand)}
  .knop[disabled]{opacity:.45;cursor:default;transform:none}

  /* ---------- quiz ---------- */
  .vraagvoortgang{display:flex;flex-direction:column;gap:9px}
  .stippen{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  /* bij een challenge van 25 vragen moeten de bolletjes op twee rijen passen */
  .stippen.veel{gap:5px;max-width:420px;margin:0 auto}
  .stippen.veel .stip{width:11px;height:11px}
  .vraagteller{
    text-align:center;font-size:12.5px;font-weight:700;
    color:var(--inkt-zacht);font-variant-numeric:tabular-nums;
  }
  .challengebalk{
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--kaart);
    border:2px solid var(--rand);
    border-radius:999px;
    padding:8px 16px;
    font-size:13px;font-weight:900;
  }
  .challengebalk span:last-child{color:var(--inkt-zacht);font-weight:700;font-variant-numeric:tabular-nums}
  .stip{width:13px;height:13px;border-radius:50%;background:var(--ruit);border:2px solid transparent}
  .stip.nu{border-color:var(--inkt);background:transparent}
  .stip.goed{background:var(--goed)}
  .stip.fout{background:var(--fout)}

  .somkaart{
    background:var(--kaart);
    border:2px solid var(--rand);
    border-radius:24px;
    padding:26px 18px;
    text-align:center;
    box-shadow:0 8px 20px var(--schaduw);
  }
  .som{
    font-family:"Lilita One",Impact,sans-serif;
    font-size:clamp(38px,12vw,60px);
    line-height:1.1;
    display:flex;align-items:center;justify-content:center;gap:.28em;
    flex-wrap:wrap;
    font-variant-numeric:tabular-nums;
  }
  .som .op{color:var(--kleur, var(--framboos))}
  .vak{
    min-width:2.1em;
    padding:.04em .18em;
    border-bottom:6px solid var(--kleur, var(--framboos));
    color:var(--inkt);
  }
  .vak.leeg{color:var(--inkt-zacht)}
  .caret::after{content:"";display:inline-block;width:3px;height:.8em;background:var(--inkt);margin-left:2px;vertical-align:-.08em;animation:knipper 1s steps(1) infinite}
  @keyframes knipper{50%{opacity:0}}
  .somkaart.juist{border-color:var(--goed);animation:pop .35s ease}
  .somkaart.mis{border-color:var(--fout);animation:schud .4s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes schud{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .reactie{
    margin-top:14px;font-weight:900;font-size:17px;min-height:26px;
  }
  .reactie.juist{color:var(--goed)}
  .reactie.mis{color:var(--fout)}

  /* vrije vraagvorm: zinnetje, eenheid, labelrij onder de vakken */
  .zin{
    font-size:16px;font-weight:700;line-height:1.5;
    max-width:34ch;margin:0 auto 16px;
    color:var(--inkt);
  }
  .eenheid{font-size:.58em;font-weight:900;color:var(--inkt-zacht);align-self:center}
  .restwoord{font-size:.5em;font-weight:900;color:var(--inkt-zacht);align-self:center}
  .onder{
    display:flex;gap:12px;justify-content:center;
    margin-top:8px;font-size:12px;font-weight:900;
    letter-spacing:.08em;text-transform:uppercase;color:var(--inkt-zacht);
  }
  .klokrij{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
  .klokrij svg{width:clamp(64px,20vw,92px);height:auto}
  .klokrij .pijl{font-size:24px;color:var(--inkt-zacht)}
  .breuk{
    display:inline-flex;flex-direction:column;align-items:center;
    font-size:.62em;line-height:1.06;vertical-align:.06em;
  }
  .breuk i{font-style:normal}
  .breuk i:last-child{border-top:3px solid currentColor;padding-top:1px}

  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .toets.breed{grid-column:1 / -1}

  /* ---------- tijdens het rekenen ----------
     Het toetsenbord stond mee te scrollen, wat bij het typen erg in de weg zit.
     Toetsenbord en stopknop staan nu samen vast onderaan; de som en de score
     blijven daarboven in beeld. */
  .rekenbalk{display:flex;flex-direction:column;gap:10px}
  body[data-scherm="ronde"] .rekenbalk{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    width:calc(min(620px, 100vw) - 36px - env(safe-area-inset-left) - env(safe-area-inset-right));
    padding:12px 0 calc(10px + env(safe-area-inset-bottom));
    background:var(--papier);
    box-shadow:0 -10px 20px -12px var(--schaduw);
    z-index:15;
  }
  /* te krap om vast te zetten: dan loopt de balk gewoon mee in de pagina */
  body[data-scherm="ronde"].krap .rekenbalk{
    position:static;transform:none;width:auto;
    padding:0;background:none;box-shadow:none;
  }
  /* Wat tijdens het rekenen niet nodig is, gaat weg: zo blijven de som en de
     score boven het toetsenbord staan, ook op een telefoon. */
  body[data-scherm="ronde"] .kopknoppen{display:none}
  body[data-scherm="ronde"] .tabletstrook{display:none}
  body[data-scherm="ronde"] .logo{font-size:clamp(21px,5.5vw,28px)}
  body[data-scherm="ronde"] .wrap{
    gap:14px;
    padding-block-start:calc(12px + env(safe-area-inset-top));
  }
  body[data-scherm="ronde"] .score div{padding:7px 6px}
  body[data-scherm="ronde"] .score b{font-size:21px}
  body[data-scherm="ronde"] .somkaart{padding:16px 14px}

  /* Op een laag scherm (telefoon rechtop) moet de vaste balk minder hoog zijn,
     anders schuift hij over de som heen. De toetsen blijven ruim boven de
     44 px die een vinger nodig heeft. */
  @media (max-height:800px){
    body[data-scherm="ronde"] .rekenbalk{gap:8px;padding-top:10px}
    body[data-scherm="ronde"] .pad{gap:8px}
    body[data-scherm="ronde"] .toets{padding:10px 0;font-size:24px}
    body[data-scherm="ronde"] .knop{padding:9px 14px;font-size:17px}
    body[data-scherm="ronde"] .somkaart{padding:12px 14px}
  }
  /* Is het scherm echt kort, dan gaat de titel er tijdens het rekenen ook af:
     de som en de score zijn dan belangrijker dan de kop. */
  @media (max-height:640px){
    body[data-scherm="ronde"] .kop{display:none}
  }

  /* de voetregels en het versienummer horen alleen op het beginscherm */
  #regels, .versieregel{display:none}
  body[data-scherm="thuis"] #regels,
  body[data-scherm="thuis"] .versieregel{display:block}
  .toets{
    font-family:"Nunito",sans-serif;
    font-weight:900;font-size:27px;
    padding:16px 0;
    cursor:pointer;
    border:none;border-radius:16px;
    background:var(--kaart);color:var(--inkt);
    border:2px solid var(--rand);
    box-shadow:0 4px 0 var(--rand);
    font-variant-numeric:tabular-nums;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .toets:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rand)}
  .toets.wis{font-size:20px;color:var(--inkt-zacht)}
  .toets.ok{background:var(--gras);color:#fff;border-color:transparent;box-shadow:0 4px 0 #12905B;font-family:"Lilita One",Impact,sans-serif;font-size:23px;letter-spacing:.03em}
  .toets.ok:active{box-shadow:0 1px 0 #12905B}
  .toets[disabled]{opacity:.45;cursor:default;transform:none}

  /* ---------- klaar ---------- */
  .klaar{text-align:center}
  .klaar .cijfer{
    font-family:"Lilita One",Impact,sans-serif;
    font-size:76px;line-height:1;color:var(--framboos);
    font-variant-numeric:tabular-nums;
  }
  .klaar .van{font-size:15px;font-weight:700;color:var(--inkt-zacht);margin-top:-2px}
  .klaar p.woord{font-family:"Lilita One",Impact,sans-serif;font-size:26px;margin:14px 0 0}
  .foutenlijst{margin-top:18px;text-align:left}
  .foutenlijst h3{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--inkt-zacht);margin:0 0 8px}
  .foutenlijst ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
  .foutenlijst li{
    font-weight:900;font-variant-numeric:tabular-nums;
    background:var(--papier);border:2px solid var(--rand);
    border-radius:10px;padding:6px 10px;font-size:15px;
  }

  .knoppen{display:flex;gap:10px;flex-wrap:wrap}
  .knop{
    flex:1 1 150px;
    font-family:"Lilita One",Impact,sans-serif;
    font-size:19px;letter-spacing:.02em;
    cursor:pointer;border:none;border-radius:16px;
    padding:15px 18px;
    background:var(--gras);color:#fff;
    box-shadow:0 4px 0 #12905B;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .knop:active{transform:translateY(3px);box-shadow:0 1px 0 #12905B}
  .knop.stil{background:var(--kaart);color:var(--inkt);border:2px solid var(--rand);box-shadow:0 4px 0 var(--rand)}
  .knop.stil:active{box-shadow:0 1px 0 var(--rand)}

  /* ---------- toast + beloning ---------- */
  /* Verbergen met visibility, niet door hem omlaag te schuiven: een verschuiving
     van een percentage van de eigen hoogte valt op een telefoon weg tegen de
     veilige zone onderaan, en dan blijft de melding op de rand staan. */
  /* Bovenaan, niet onderaan: onderin kwam hij over het cijfertoetsenbord heen. */
  .toast{
    position:fixed;left:50%;
    top:calc(12px + env(safe-area-inset-top));
    transform:translateX(-50%) translateY(-16px);
    opacity:0;
    visibility:hidden;
    background:var(--inkt);color:var(--papier);
    padding:12px 20px;border-radius:999px;
    font-weight:900;font-size:15px;
    box-shadow:0 8px 24px var(--schaduw);
    transition:transform .3s cubic-bezier(.2,.9,.3,1), opacity .3s ease, visibility 0s linear .3s;
    z-index:20;
    max-width:min(92vw,420px);text-align:center;
  }
  .toast.zie{
    transform:translateX(-50%) translateY(0);
    opacity:1;
    visibility:visible;
    transition:transform .3s cubic-bezier(.2,.9,.3,1), opacity .3s ease, visibility 0s;
  }

  .overlay{
    position:fixed;inset:0;z-index:30;
    background:rgba(16,28,51,.72);
    display:grid;place-items:center;
    padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
            calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  .overlay .doos{
    background:var(--kaart);
    border-radius:26px;
    padding:30px 24px;
    text-align:center;
    max-width:400px;width:100%;
    box-shadow:0 18px 50px rgba(0,0,0,.4);
    animation:opkomst .45s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes opkomst{from{transform:scale(.82) translateY(18px);opacity:0}to{transform:none;opacity:1}}
  .overlay .doos .trofee{font-size:64px;line-height:1}
  .overlay .doos h2{font-size:27px;margin:10px 0 6px}
  .overlay .doos p{margin:0 0 20px;font-weight:700;color:var(--inkt-zacht)}

  .voet{font-size:12.5px;font-weight:700;color:var(--inkt-zacht);text-align:center}
  .versieregel{font-size:11.5px;opacity:.75;margin-top:-14px}

  /* melding dat er een nieuwe versie klaarstaat */
  .nieuwebalk{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:25;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
    background:var(--inkt);color:var(--papier);
    border-radius:999px;padding:10px 12px 10px 20px;
    font-size:13.5px;font-weight:700;
    box-shadow:0 8px 24px var(--schaduw);
    max-width:min(92vw,440px);
  }
  .nieuwebalk button{
    font:inherit;font-weight:900;font-size:13px;
    cursor:pointer;border:none;border-radius:999px;
    padding:8px 15px;
    background:var(--gras);color:#fff;
  }
  .voet button{font:inherit;color:var(--inkt-zacht);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0}

  /* ---------- klokkijken ---------- */
  .niveaus{display:flex;flex-direction:column;gap:10px}
  .niveau{
    font:inherit;text-align:left;cursor:pointer;
    border:none;border-radius:16px;padding:15px 18px;
    background:var(--klok);color:#fff;
    box-shadow:0 4px 0 #C9531C;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .niveau:active{transform:translateY(3px);box-shadow:0 1px 0 #C9531C}
  .niveau.uit{
    background:var(--kaart);
    color:var(--inkt);
    border:2px solid var(--rand);
    box-shadow:0 4px 0 var(--rand);
  }
  .niveau.uit span{color:var(--inkt-zacht);opacity:1}
  .niveau.uit:active{box-shadow:0 1px 0 var(--rand)}
  .niveau b{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:20px;letter-spacing:.02em;display:block}
  .niveau span{font-size:13.5px;font-weight:700;opacity:.9;display:block;margin-top:1px}

  .klokhouder{display:grid;place-items:center;padding:4px 0 2px}
  .klokhouder svg{width:min(240px,62vw);height:auto;max-width:100%;display:block}
  .k-wijzer{fill:var(--kaart);stroke:var(--inkt);stroke-width:6}
  .k-streep{stroke:var(--inkt-zacht);stroke-width:2;stroke-linecap:round}
  .k-streep-u{stroke:var(--inkt);stroke-width:4.5;stroke-linecap:round}
  .k-cijfer{fill:var(--inkt);font-family:"Lilita One",Impact,sans-serif}
  .k-minuut{stroke:var(--framboos);stroke-width:6;stroke-linecap:round}
  .k-uur{stroke:var(--zee);stroke-width:9.5;stroke-linecap:round}
  .k-pin{fill:var(--inkt)}
  .legenda{
    display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
    margin-top:14px;font-size:12.5px;font-weight:700;color:var(--inkt-zacht);
  }
  .legenda i{display:inline-block;width:22px;height:5px;border-radius:3px;margin-right:6px;vertical-align:.12em}
  .legenda .u i{background:var(--zee)}
  .legenda .m i{background:var(--framboos)}

  .digitaal{
    font-family:"Lilita One",Impact,sans-serif;
    font-size:clamp(46px,15vw,72px);
    line-height:1;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
    color:var(--klok);
  }
  .inwoorden{font-weight:900;font-size:17px;color:var(--inkt-zacht);margin-top:6px}
  .vraagje{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--inkt-zacht);margin-bottom:12px}

  .keuzes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .keuzes.drie{grid-template-columns:repeat(3,1fr)}
  .keuzes.drie .tijd{font-size:34px}
  .keuze{
    font:inherit;cursor:pointer;
    background:var(--kaart);color:var(--inkt);
    border:2px solid var(--rand);border-radius:16px;
    box-shadow:0 4px 0 var(--rand);
    padding:14px 10px;
    display:grid;place-items:center;gap:2px;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .keuze:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rand)}
  .keuze .tijd{font-family:"Lilita One",Impact,sans-serif;font-size:27px;line-height:1;font-variant-numeric:tabular-nums}
  .keuze .woorden{font-size:13px;font-weight:700;color:var(--inkt-zacht);text-align:center}
  .keuze svg{width:100%;max-width:132px;height:auto;display:block}
  .keuze.klokje{padding:10px}
  .keuze.juist{background:var(--goed);border-color:transparent;color:#fff;box-shadow:0 4px 0 #12905B}
  .keuze.juist .woorden{color:rgba(255,255,255,.85)}
  .keuze.mis{background:var(--fout);border-color:transparent;color:#fff;box-shadow:0 4px 0 #A3172F}
  .keuze.mis .woorden{color:rgba(255,255,255,.85)}
  .keuze[disabled]{cursor:default;transform:none}

  /* ---------- welkomkaart en de pagina Voor Saar ---------- */
  .welkomknop{
    font:inherit;text-align:left;cursor:pointer;
    width:100%;
    border:none;border-radius:18px;
    padding:15px 18px;
    display:flex;align-items:center;gap:14px;
    color:#fff;
    background:linear-gradient(100deg, var(--framboos), var(--druif));
    box-shadow:0 5px 0 #7A2F8E, 0 8px 16px var(--schaduw);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .welkomknop:active{transform:translateY(4px);box-shadow:0 1px 0 #7A2F8E, 0 3px 8px var(--schaduw)}
  .welkomknop .ster{font-size:30px;line-height:1;flex:none}
  .welkomknop b{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:20px;letter-spacing:.02em;display:block}
  .welkomknop span{font-size:13px;font-weight:700;opacity:.9;display:block;margin-top:1px}

  .brief{max-width:46ch;margin:0 auto}
  .brief h2{
    font-size:clamp(26px,7vw,34px);
    text-align:center;
    margin:0 0 6px;
  }
  .brief .hoi{
    text-align:center;font-family:"Lilita One",Impact,sans-serif;
    font-size:21px;color:var(--framboos);margin:0 0 18px;
  }
  .brief p{font-size:16px;line-height:1.65;font-weight:700;margin:0 0 14px;color:var(--inkt)}
  .brief p.zacht{color:var(--inkt-zacht)}
  .brief h3{
    font-family:"Lilita One",Impact,sans-serif;font-weight:400;
    font-size:19px;margin:22px 0 12px;letter-spacing:.02em;
  }
  .trap{display:flex;flex-direction:column;gap:9px;margin:0 0 18px;padding:0;list-style:none}
  .trap li{
    display:flex;align-items:center;gap:12px;
    background:var(--papier);
    border:2px solid var(--rand);
    border-radius:14px;
    padding:11px 14px;
    font-weight:900;font-size:15px;
  }
  .trap li .teller{font-size:22px;line-height:1;flex:none}
  .brief .slotzin{
    text-align:center;
    font-family:"Lilita One",Impact,sans-serif;
    font-size:22px;
    color:var(--druif);
    margin:22px 0 0;
  }

  /* ---------- snelknoppen challenges en rapport ---------- */
  .snelrij{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .snel{
    font:inherit;text-align:left;cursor:pointer;
    border:none;border-radius:18px;padding:14px 15px;
    display:flex;align-items:center;gap:12px;
    color:#fff;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .snel:active{transform:translateY(4px)}
  .snel .teken{font-size:26px;line-height:1;flex:none}
  .snel b{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:18px;letter-spacing:.02em;display:block}
  .snel > span > span{font-size:12px;font-weight:700;opacity:.9;display:block;margin-top:1px;line-height:1.3}
  .snel.uitdaging{background:var(--druif);box-shadow:0 5px 0 #6A3FD1, 0 8px 16px var(--schaduw)}
  .snel.uitdaging:active{box-shadow:0 1px 0 #6A3FD1}
  .snel.voortgang{background:var(--zee);box-shadow:0 5px 0 #1A6FB4, 0 8px 16px var(--schaduw)}
  .snel.voortgang:active{box-shadow:0 1px 0 #1A6FB4}

  /* ---------- stapel stickervellen ---------- */
  .stapel{position:relative}
  .stapel > .kaart{position:relative;z-index:2}
  .stapel::before,.stapel::after{
    content:"";position:absolute;inset:0;
    background:var(--kaart);
    border:2px solid var(--rand);
    border-radius:20px;
    box-shadow:0 3px 10px var(--schaduw);
    z-index:1;
  }
  .stapel::before{transform:rotate(-1.7deg) translate(-6px,6px)}
  .stapel::after{transform:rotate(1.5deg) translate(7px,10px)}
  .stapel.geen::before,.stapel.geen::after{display:none}
  .stapel.een::after{display:none}
  /* ---------- supersticker en het feestje ---------- */
  .slot.super{
    border-color:#FFD84D;
    box-shadow:0 0 0 3px rgba(255,216,77,.45), 0 3px 10px var(--schaduw);
    animation:glans 2.4s ease-in-out infinite;
  }
  @keyframes glans{
    0%,100%{box-shadow:0 0 0 3px rgba(255,216,77,.45), 0 3px 10px var(--schaduw)}
    50%{box-shadow:0 0 0 7px rgba(255,216,77,.22), 0 3px 14px var(--schaduw)}
  }
  .klaar.foutloos{border-color:#FFD84D;box-shadow:0 0 0 3px rgba(255,216,77,.35)}
  .klaar .prijs.super{color:var(--zon);font-size:17px}
  .klaar .prijs.super b{color:var(--inkt)}
  .challengekop.foutloos{color:var(--zon)}

  .feest{
    position:fixed;inset:0;z-index:40;
    pointer-events:none;overflow:hidden;
  }
  .feest i{
    position:absolute;top:-8%;
    font-style:normal;line-height:1;
    animation-name:dwarrel;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
  }
  @keyframes dwarrel{
    0%{transform:translateY(-10vh) rotate(0deg);opacity:0}
    10%{opacity:1}
    100%{transform:translateY(110vh) rotate(420deg);opacity:.9}
  }

  /* bladeren door de vellen; tapdoelen van 44px, ook met een vinger te bedienen */
  .velnav{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-bottom:12px;
  }
  .velpijl{
    width:44px;height:44px;flex:none;
    font-size:26px;line-height:1;
    cursor:pointer;
    border:2px solid var(--rand);border-radius:14px;
    background:var(--papier);color:var(--inkt);
  }
  .velpijl[disabled]{opacity:.3;cursor:default}
  .velnaam{
    font-family:"Lilita One",Impact,sans-serif;font-size:18px;letter-spacing:.02em;
    text-align:center;flex:1;
  }

  .beloningregel{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    margin-top:16px;padding:12px 14px;
    border:2px dashed var(--rand);border-radius:14px;
  }
  .beloningregel.gegeven{border-style:solid;border-color:var(--goed);background:rgba(31,184,119,.10)}
  .beloningregel .teken{font-size:24px;line-height:1;flex:none}
  .beloningregel b{font-size:14.5px;display:block}
  .beloningregel span span{font-size:12.5px;font-weight:700;color:var(--inkt-zacht);display:block;margin-top:1px}
  .beloningregel > span:nth-child(2){flex:1 1 130px}
  .velknop{
    font:inherit;font-size:13px;font-weight:900;
    cursor:pointer;flex:none;
    border:2px solid var(--rand);border-radius:999px;
    padding:9px 14px;
    background:var(--kaart);color:var(--inkt-zacht);
  }
  .velknop.aan{background:var(--gras);color:#fff;border-color:transparent}

  .notitieveld{
    width:100%;
    font-family:"Nunito",sans-serif;font-weight:700;font-size:16px;
    padding:11px 13px;border-radius:12px;
    border:2px solid var(--rand);
    background:var(--papier);color:var(--inkt);
  }
  .notitieveld:focus{border-color:var(--zee)}

  .velkop{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:10px;margin-bottom:14px;
  }
  .velkop span:first-child{
    font-family:"Lilita One",Impact,sans-serif;font-size:17px;letter-spacing:.02em;
  }
  .velkop span:last-child{font-size:12.5px;font-weight:700;color:var(--inkt-zacht)}

  /* ---------- challenges ---------- */
  .challenges{display:flex;flex-direction:column;gap:12px}
  .challenge{
    position:relative;
    font:inherit;text-align:left;cursor:pointer;
    border:none;border-radius:18px;padding:16px;
    display:flex;align-items:center;gap:14px;
    background:var(--kleur);color:var(--op);
    box-shadow:0 5px 0 rgba(0,0,0,.22), 0 8px 16px var(--schaduw);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .challenge:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
  .challenge .teken{font-size:32px;line-height:1;flex:none;width:50px;text-align:center}
  .challenge b{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:20px;letter-spacing:.02em;display:block}
  .challenge .woorden > span{font-size:13px;font-weight:700;opacity:.92;display:block;margin-top:2px;line-height:1.35}
  .challenge .tip{
    position:absolute;top:-9px;right:12px;
    background:var(--inkt);color:var(--papier);
    font-size:11px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;
    padding:4px 10px;border-radius:999px;
  }
  .challengekop{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-bottom:14px;
    font-family:"Lilita One",Impact,sans-serif;font-size:21px;
  }
  .challengekop .teken{font-size:28px}
  .challengekop.gehaald{color:var(--goed)}
  .challengekop.net-niet{color:var(--inkt-zacht)}
  .klaar .prijs{
    margin:12px 0 0;font-weight:900;font-size:16px;color:var(--framboos);
  }

  /* ---------- rapport ---------- */
  .samenvatting{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
  .samenvatting b{
    display:block;font-family:"Lilita One",Impact,sans-serif;font-size:27px;line-height:1.1;
    font-variant-numeric:tabular-nums;color:var(--zee);
  }
  .samenvatting span{font-size:12px;font-weight:700;color:var(--inkt-zacht);line-height:1.3;display:block;margin-top:2px}

  .staven{display:flex;flex-direction:column;gap:16px}
  .staaf .rij{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  .staaf .rij b{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:17px;letter-spacing:.02em}
  .staaf .rij.klein{margin:5px 0 0;font-size:12.5px;font-weight:700;color:var(--inkt-zacht);font-variant-numeric:tabular-nums}
  .stempel{
    font-size:11.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;
    padding:4px 10px;border-radius:999px;white-space:nowrap;
  }
  .stempel.sterk{background:rgba(31,184,119,.16);color:var(--goed)}
  .stempel.goed{background:rgba(42,148,232,.16);color:var(--zee)}
  .stempel.aandacht{background:rgba(255,122,61,.18);color:var(--klok)}
  .stempel.leeg{background:var(--ruit);color:var(--inkt-zacht)}

  .detail{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .deelstip{
    font-size:11.5px;font-weight:900;
    padding:4px 9px;border-radius:999px;
    background:var(--ruit);color:var(--inkt-zacht);
  }
  .deelstip.sterk{background:rgba(31,184,119,.16);color:var(--goed)}
  .deelstip.goed{background:rgba(42,148,232,.16);color:var(--zee)}
  .deelstip.aandacht{background:rgba(255,122,61,.18);color:var(--klok)}

  .tafelrapport{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .tafelhok{
    border-radius:12px;padding:9px 4px;text-align:center;
    border:2px solid var(--rand);background:var(--papier);
  }
  .tafelhok b{
    display:block;font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:19px;line-height:1.1;
  }
  .tafelhok span{font-size:11.5px;font-weight:900;color:var(--inkt-zacht);font-variant-numeric:tabular-nums}
  .tafelhok.sterk{background:rgba(31,184,119,.15);border-color:rgba(31,184,119,.5)}
  .tafelhok.sterk span{color:var(--goed)}
  .tafelhok.goed{background:rgba(42,148,232,.13);border-color:rgba(42,148,232,.45)}
  .tafelhok.goed span{color:var(--zee)}
  .tafelhok.aandacht{background:rgba(255,122,61,.16);border-color:rgba(255,122,61,.5)}
  .tafelhok.aandacht span{color:var(--klok)}
  .legenda-uitleg{margin:14px 0 0;font-size:12.5px;font-weight:700;color:var(--inkt-zacht);line-height:1.45}

  .aandachtlijst{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .aandachtlijst li{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:var(--papier);border:2px solid var(--rand);border-radius:12px;
    padding:9px 13px;font-weight:900;font-variant-numeric:tabular-nums;font-size:15px;
  }
  .aandachtlijst .keer{font-size:12px;font-weight:700;color:var(--klok);white-space:nowrap}

  .advies{display:flex;gap:14px;align-items:flex-start}
  .advies .lamp{font-size:24px;line-height:1.2;flex:none}
  .advies p{margin:0;font-size:14.5px;font-weight:700;line-height:1.55;color:var(--inkt)}

  /* ---------- instellingen ---------- */
  .instellingen{display:flex;flex-direction:column;gap:18px}
  .instelling{display:grid;gap:10px;padding-bottom:18px;border-bottom:2px solid var(--rand)}
  .instelling:last-child{border-bottom:none;padding-bottom:0}
  .instelling .titel{display:flex;align-items:center;gap:11px}
  .merk{
    width:36px;height:36px;flex:none;border-radius:11px;
    display:grid;place-items:center;color:#fff;

  }
  .merk.plus{background:var(--gras)}
  .merk.min{background:var(--zee)}
  .merk.keer{background:var(--druif)}

  .merk.ronde{background:var(--zee);font-size:15px}

  .instelling .titel b{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:19px;letter-spacing:.02em}
  .velden{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .velden label{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--inkt-zacht)}
  .velden input{
    width:82px;
    font-family:"Nunito",sans-serif;font-weight:900;font-size:17px;
    font-variant-numeric:tabular-nums;text-align:center;

    border:2px solid var(--rand);

  }
  .velden input:focus{border-color:var(--zee)}
  .voorbeeld{
    margin:0;font-size:13.5px;font-weight:700;
    color:var(--inkt-zacht);font-variant-numeric:tabular-nums;
  }
  .voorbeeld b{color:var(--inkt)}
  /* ---------- slot op de instellingen ---------- */
  .slotkaart{text-align:center}
  .codevakjes{display:flex;gap:12px;justify-content:center;margin:6px 0 4px}
  .codevak{
    width:52px;height:62px;
    border:2px solid var(--rand);

  /* ---------- groep en onderwerpschakelaars ---------- */
  .groepen{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .groepknop{
    font-family:"Lilita One",Impact,sans-serif;font-size:22px;

  .groepknop.uit{
    background:var(--kaart);color:var(--inkt-zacht);
    border-color:var(--rand);box-shadow:0 4px 0 var(--rand);
  }
  .groepknop.uit:active{box-shadow:0 1px 0 var(--rand)}

  .schakelaars{display:flex;flex-direction:column;gap:10px}
  .vakkop{
    font-family:"Lilita One",Impact,sans-serif;font-weight:400;
    font-size:15px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--inkt-zacht);margin:10px 0 2px;
  }
  .vakkop:first-child{margin-top:0}
  .schakelrij{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;
    padding-bottom:10px;border-bottom:2px solid var(--rand);
  }
  .schakelrij:last-child{border-bottom:none;padding-bottom:0}
  .schakelrij .naam{font-weight:900;font-size:14.5px;flex:1 1 140px}
  .schakelrij .naam i{
    display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--inkt-zacht);
    margin-left:17px;
  }
  /* stoplichtje: staat dit onderwerp op dit moment aan? */
  .bol{
    display:inline-block;width:10px;height:10px;border-radius:50%;
    margin-right:7px;vertical-align:.02em;
  }
  .bol.aan{background:var(--goed)}
  .bol.uit{background:var(--fout)}

  /* ingeklapte vakken, zodat het scherm niet eindeloos lang wordt */
  .vakblok{
    border:2px solid var(--rand);border-radius:16px;
    background:var(--kaart);
    margin-bottom:10px;
    overflow:hidden;
  }
  .vakblok > summary{
    cursor:pointer;list-style:none;
    padding:13px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .vakblok > summary::-webkit-details-marker{display:none}
  .vakblok > summary::after{
    content:"▾";font-size:15px;color:var(--inkt-zacht);flex:none;
    transition:transform .18s ease;
  }
  .vakblok[open] > summary::after{transform:rotate(180deg)}
  .vaknaam{
    font-family:"Lilita One",Impact,sans-serif;font-size:17px;letter-spacing:.02em;
    flex:1;
  }
  .vaktelling{font-size:12.5px;font-weight:700;color:var(--inkt-zacht);white-space:nowrap}
  .vakblok .kaart{border:none;border-radius:0;padding:0 16px 16px}

  .velden label.vinkje{gap:9px;font-size:13.5px}
  .velden input[type="checkbox"]{
    width:22px;height:22px;flex:none;accent-color:var(--zee);
  }
  .merk.slot{background:var(--inkt);font-size:17px}
  #wachtwoord{width:96px;letter-spacing:.3em;text-align:center}
  .standen{display:flex;gap:4px;background:var(--papier);border-radius:999px;padding:3px;flex:none}
  .stand{
    font:inherit;font-size:12px;font-weight:900;
    cursor:pointer;border:none;border-radius:999px;
    padding:6px 11px;background:transparent;color:var(--inkt-zacht);
  }
  .stand.nu{background:var(--zee);color:#fff}

  .uitlegregel{
    margin:0 0 16px;font-size:14px;font-weight:700;color:var(--inkt-zacht);
    max-width:56ch;
  }

  :focus-visible{outline:3px solid var(--zee);outline-offset:3px}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
  /* ---------- telefoon ---------- */
  @media (max-width:540px){
    .wrap{gap:18px}
    .kop{gap:10px}
    .logo{font-size:clamp(25px,7.4vw,34px)}
    .kopknoppen{width:100%}
    .geluid{font-size:13px;padding:6px 13px}

    .score div{padding:9px 6px}
    .score b{font-size:23px}
    .score span{font-size:10.5px;letter-spacing:.05em}

    /* de vier smalle kaarten worden staand, anders is er te weinig plek voor de tekst */
    .cats{gap:10px}
    .cat.plus,.cat.min,.cat.keer,.cat.deel{
      flex-direction:column;
      align-items:flex-start;
      gap:9px;
      padding:13px 13px 12px;
    }
    .cat.plus .teken,.cat.min .teken,.cat.keer .teken,.cat.deel .teken{
      width:42px;height:42px;font-size:27px;border-radius:12px;
    }
    .cat .naam{font-size:18px}
    .cat .uitleg{font-size:12px;line-height:1.3}

    .somkaart{padding:22px 14px}
    .toets{font-size:25px;padding:15px 0}
    .keuze .tijd{font-size:24px}
    .keuze .woorden{font-size:12px}
    .velden label{font-size:13px}
    .velden input{width:74px}
  }

  @media (max-width:400px){
    .snelrij{grid-template-columns:1fr}
  }

  @media (max-width:340px){
    .cats{grid-template-columns:1fr}
    .slots{gap:7px}
  }

  /* ---------- app installeren ---------- */
  .kopknoppen{display:flex;gap:8px;flex-wrap:wrap}
  .geluid.plaatsen{
    background:var(--gras);color:#fff;border-color:transparent;
  }
  .geluid.plaatsen:hover{color:#fff}
  .groepstrook{
    font:inherit;text-align:left;cursor:pointer;width:100%;
    border:2px dashed var(--rand);border-radius:16px;
    background:var(--kaart);color:var(--inkt);
    padding:13px 16px;margin-top:12px;
    display:flex;align-items:center;gap:13px;
  }
  .groepstrook .teken{font-size:24px;line-height:1;flex:none}
  .groepstrook b{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:17px;display:block}
  .groepstrook span span{font-size:12.5px;font-weight:700;color:var(--inkt-zacht);display:block;margin-top:1px}

  /* uitnodiging om de app op het beginscherm te zetten */
  .tabletstrook{
    font:inherit;text-align:left;cursor:pointer;width:100%;
    border:2px solid var(--rand);border-radius:16px;
    background:var(--kaart);color:var(--inkt);
    padding:13px 16px;margin-top:12px;
    display:flex;align-items:center;gap:13px;
  }
  .tabletstrook .teken{font-size:24px;line-height:1;flex:none}
  .tabletstrook b{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:17px;display:block}
  .tabletstrook span span{font-size:12.5px;font-weight:700;color:var(--inkt-zacht);display:block;margin-top:1px}

  .uitleglijst{display:flex;flex-direction:column;gap:14px}
  .uitlegblok h3{
    font-family:"Lilita One",Impact,sans-serif;font-weight:400;
    font-size:18px;margin:0 0 8px;letter-spacing:.02em;
  }
  .stappen{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
  .stappen li{font-size:14.5px;font-weight:700;line-height:1.5}

  .tiphint{
    background:var(--kaart);
    border:2px dashed var(--rand);
    border-radius:14px;
    padding:12px 16px;
    font-size:13.5px;font-weight:700;
    color:var(--inkt-zacht);
    text-align:center;
  }
  .tiphint b{color:var(--inkt)}
</style>
